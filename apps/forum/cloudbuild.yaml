# Cloud Build — eno.forum: build → push → deploy to Cloud Run.
# REPO-ROOT-RELATIVE (dir: apps/forum) so the GitHub trigger can use it; manual
# runs therefore submit FROM THE REPO ROOT:
#   gcloud builds submit --config apps/forum/cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
steps:
  - id: build-push
    name: gcr.io/cloud-builders/docker
    dir: apps/forum
    entrypoint: bash
    secretEnv: ['BUILDENV']
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$BUILDENV" > /workspace/buildenv.env
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=buildenv,src=/workspace/buildenv.env \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum:${_TAG} \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum:latest \
          .
        rm -f /workspace/buildenv.env
        docker push --all-tags asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - eno-forum
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum:${_TAG}
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      - --quiet
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/eno-forum-env/versions/latest
      env: BUILDENV
substitutions:
  _TAG: manual
options:
  # No machineType pin: no E2_HIGHCPU_8 quota in the trigger region.
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1800s
