# Cloud Build — eno.forum image (context = apps/forum).
# Manual run (from apps/forum):
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['BUILDENV']
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$BUILDENV" > /workspace/buildenv.env
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=buildenv,src=/workspace/buildenv.env \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum:${_TAG} \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum:latest \
          .
        rm -f /workspace/buildenv.env
        docker push --all-tags asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-forum
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/eno-forum-env/versions/latest
      env: BUILDENV
substitutions:
  _TAG: manual
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
