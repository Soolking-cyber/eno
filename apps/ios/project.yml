# eno — NATIVE iOS app (owner direction 2026-07-19: "comprehensive native app
# rewrite… ios native", UI mirroring the web app as closely as possible).
#
# The Xcode project is GENERATED — never hand-edit Eno.xcodeproj (gitignored).
# After adding/removing Swift files: `xcodegen generate` in this directory.
# Sources are globbed from Eno/, so new files need only regeneration, keeping
# Kyle's and Murat's lanes free of pbxproj merge conflicts.
#
# Coexists with the Capacitor WebView app (com.mk1e3.enovn) on the same phone
# during the transition — different bundle id, display name "eno native".
# Bundle id vn.eno.app: a valid team provisioning profile for it already exists
# on this Mac (covers the owner's phone) — headless xcodebuild can't mint NEW
# profiles ("No Accounts"), so we ride the existing one. If signing starts
# failing with "expired profile", open Eno.xcodeproj in Xcode once to renew.
name: Eno
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Owner's personal team (same as the Capacitor app's local signing). A team
    # id ships inside every public IPA — it is not a secret.
    DEVELOPMENT_TEAM: S4VCY6N8QR
    CODE_SIGN_STYLE: Automatic
    # Swift 6.3 compiler, language mode 5 for now — strict-concurrency migration
    # is a later, deliberate pass; velocity matters more while screens land.
    SWIFT_VERSION: "5.0"
targets:
  Eno:
    type: application
    platform: iOS
    sources: [Eno]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.eno.app
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    info:
      path: Eno/Info.plist
      properties:
        CFBundleDisplayName: eno.vn
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Purpose strings are REQUIRED — camera/mic are used by the listing photo
        # + video capture. xcodegen regenerates Info.plist from THESE properties
        # (it is the source of truth), so keys must live here, not only in the
        # generated plist, or a regen silently drops them (App Review rejection).
        NSCameraUsageDescription: Take photos of your item to add them to your listing.
        NSMicrophoneUsageDescription: Record sound when you capture a video for your listing.
        NSLocationWhenInUseUsageDescription: Fill your listing's area from your current location. Used once when you tap it; your location is not stored.
        # Our OWN OAuth callback scheme (distinct from the Capacitor app's
        # enovn://). ASWebAuthenticationSession intercepts it in-process; the
        # registration keeps the OS from hunting for a handler.
        CFBundleURLTypes:
          - CFBundleURLName: vn.eno.app.oauth
            CFBundleURLSchemes: [enonative]
  # Unit tests (audit #11) — pure Core logic (ImageURL, Format, RecentStore,
  # ListingCard badge rules, APIErrorBody). Swift Testing (@Test). Run:
  # xcodebuild test -scheme Eno -destination 'platform=iOS Simulator,name=iPhone 16'
  EnoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EnoTests]
    dependencies:
      - target: Eno
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Eno:
    build:
      targets:
        Eno: all
        EnoTests: [test]
    test:
      targets: [EnoTests]
    run:
      config: Debug
