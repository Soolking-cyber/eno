# eno — NATIVE iOS app (owner direction 2026-07-19: "comprehensive native app
# rewrite… ios native", UI mirroring the web app as closely as possible).
#
# The Xcode project is GENERATED — never hand-edit Eno.xcodeproj (gitignored).
# After adding/removing Swift files: `xcodegen generate` in this directory.
# Sources are globbed from Eno/, so new files need only regeneration, keeping
# Kyle's and Murat's lanes free of pbxproj merge conflicts.
#
# Coexists with the Capacitor WebView app (com.mk1e3.enovn) on the same phone
# during the transition — different bundle id, display name "eno native".
# Bundle id vn.eno.app: a valid team provisioning profile for it already exists
# on this Mac (covers the owner's phone) — headless xcodebuild can't mint NEW
# profiles ("No Accounts"), so we ride the existing one. If signing starts
# failing with "expired profile", open Eno.xcodeproj in Xcode once to renew.
name: Eno
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Owner's personal team (same as the Capacitor app's local signing). A team
    # id ships inside every public IPA — it is not a secret.
    DEVELOPMENT_TEAM: S4VCY6N8QR
    CODE_SIGN_STYLE: Automatic
    # Swift 6.3 compiler, language mode 5 for now — strict-concurrency migration
    # is a later, deliberate pass; velocity matters more while screens land.
    SWIFT_VERSION: "5.0"
# EnoUI — the design system (docs/ios-design-language.md). A LOCAL package on purpose:
# the module boundary keeps app models / networking / L10n out of the components.
packages:
  EnoUI:
    path: Packages/EnoUI
targets:
  Eno:
    type: application
    platform: iOS
    sources: [Eno]
    dependencies:
      - package: EnoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.eno.app
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    info:
      path: Eno/Info.plist
      properties:
        CFBundleDisplayName: eno.vn
        # ⛔ BOTH EDITIONS, BECAUSE project.yml GENERATES Info.plist — an edit made to the plist
        # itself is reverted by the next xcodegen run, and a key added to only one `properties:`
        # block ships the brand face on one app and SF Pro on the other. Open Runde is the web's
        # face since launch; the native app shipped without it until 2026-09-06.
        # ⚠️ The FILES are picked up automatically (both targets take `Eno/` as sources, which now
        # contains Resources/Fonts); this key is what REGISTERS them at launch. Without it
        # `Font.custom` silently falls back to the system font — see EnoFont.isBundled.
        UIAppFonts:
          - OpenRunde-Regular.ttf
          - OpenRunde-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          # ⚠️ THE SAME IMAGE, AT THE SAME SIZE, THAT LaunchCoverView DRAWS AS ITS FIRST FRAME. The
          # static launch screen (this) and the SwiftUI cover hand over pixel-for-pixel — the mark
          # is centred at its intrinsic 120pt here and at 120pt there — so the cold start reads as
          # one continuous scene: mark → pop → wordmark → zoom into the app. Change one, change both.
          UIImageName: LaunchMark
          # Centred on the FULL screen, not the safe area — the cover centres the same way, and on a
          # notched phone the two centres differ by half the inset difference otherwise.
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Purpose strings are REQUIRED — camera/mic are used by the listing photo
        # + video capture. xcodegen regenerates Info.plist from THESE properties
        # (it is the source of truth), so keys must live here, not only in the
        # generated plist, or a regen silently drops them (App Review rejection).
        # ⛔ THE PURPOSE STRING MUST NAME IDENTITY CAPTURE, and it is edited HERE — both
        # Info.plists are GENERATED from this file, so fixing the plist directly is undone by
        # the next `xcodegen generate` (measured: it silently reverted this exact string).
        # The camera now also photographs a passport, a CCCD and a selfie for verification;
        # asking for it under a listing-photos pretext is a false disclosure on the most
        # sensitive thing the app collects, and App Review rejects on precisely this.
        NSCameraUsageDescription: eno uses the camera to photograph items you list, and to capture your identity document and a selfie when you verify your account.
        NSMicrophoneUsageDescription: Record sound when you capture a video for your listing.
        NSLocationWhenInUseUsageDescription: Fill your listing's area from your current location. Used once when you tap it; your location is not stored.
        # Our OWN OAuth callback scheme (distinct from the Capacitor app's
        # enovn://). ASWebAuthenticationSession intercepts it in-process; the
        # registration keeps the OS from hunting for a handler.
        CFBundleURLTypes:
          - CFBundleURLName: vn.eno.app.oauth
            CFBundleURLSchemes: [enonative]
  # ── THE SERVICES EDITION ──────────────────────────────────────────────────
  # eno.forum, from the SAME sources. Mirrors src/lib/edition.ts: one codebase,
  # two apps, the difference carried by a compile-time flag rather than by
  # literals scattered through the call sites.
  #
  # ⛔ WHY A SECOND TARGET AND NOT A RUNTIME SWITCH. The editions are a LICENSING
  # boundary, not a preference: visa and itinerary are live on eno.forum and may
  # never appear on the licensed marketplace. A compile-time condition lets the
  # compiler strip the other edition's branches out of the binary entirely, which
  # is the same property the web gets from the minifier folding IS_SERVICES.
  #
  # ⚠️ A DISTINCT BUNDLE ID so both can sit on one phone during the transition,
  # exactly as the native app already coexists with the Capacitor build.
  EnoForum:
    type: application
    platform: iOS
    # ⚠️ EXCLUDE THE OTHER TARGET'S Info.plist. This target's own plist is GENERATED at
    # EnoForum/Info.plist from `info.properties` below, but its sources are the marketplace's `Eno`
    # folder — which contains Eno/Info.plist. Without this exclude that file is swept in as a
    # RESOURCE and Xcode fails with "Multiple commands produce …/EnoForum.app/Info.plist". The Eno
    # target never hits this because its source dir and its info.path are the same folder.
    sources:
      - path: Eno
        excludes: ["Info.plist"]
    dependencies:
      - package: EnoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: forum.eno.app
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # The one line that picks the edition — read by Core/Edition.swift.
        # ⚠️ `$(inherited)` IS LOAD-BEARING. Assigning this key outright REPLACES the value Xcode
        # sets per configuration, and that value is `DEBUG` — so a Debug build of the services app
        # quietly became a build with DEBUG undefined: no assertions, and every `#if DEBUG` branch
        # (the image diagnostics among them) compiled out of the one build meant for diagnosing.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ENO_SERVICES
    info:
      path: EnoForum/Info.plist
      properties:
        CFBundleDisplayName: eno.forum
        # ⛔ BOTH EDITIONS, BECAUSE project.yml GENERATES Info.plist — an edit made to the plist
        # itself is reverted by the next xcodegen run, and a key added to only one `properties:`
        # block ships the brand face on one app and SF Pro on the other. Open Runde is the web's
        # face since launch; the native app shipped without it until 2026-09-06.
        # ⚠️ The FILES are picked up automatically (both targets take `Eno/` as sources, which now
        # contains Resources/Fonts); this key is what REGISTERS them at launch. Without it
        # `Font.custom` silently falls back to the system font — see EnoFont.isBundled.
        UIAppFonts:
          - OpenRunde-Regular.ttf
          - OpenRunde-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          # ⚠️ THE SAME IMAGE, AT THE SAME SIZE, THAT LaunchCoverView DRAWS AS ITS FIRST FRAME. The
          # static launch screen (this) and the SwiftUI cover hand over pixel-for-pixel — the mark
          # is centred at its intrinsic 120pt here and at 120pt there — so the cold start reads as
          # one continuous scene: mark → pop → wordmark → zoom into the app. Change one, change both.
          UIImageName: LaunchMark
          # Centred on the FULL screen, not the safe area — the cover centres the same way, and on a
          # notched phone the two centres differ by half the inset difference otherwise.
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # ⚠️ Purpose strings are REQUIRED and xcodegen regenerates Info.plist from
        # THESE properties — a missing key here is an App Review rejection, not a
        # runtime warning. Same set as the marketplace target.
        # ⛔ THE PURPOSE STRING MUST NAME IDENTITY CAPTURE, and it is edited HERE — both
        # Info.plists are GENERATED from this file, so fixing the plist directly is undone by
        # the next `xcodegen generate` (measured: it silently reverted this exact string).
        # The camera now also photographs a passport, a CCCD and a selfie for verification;
        # asking for it under a listing-photos pretext is a false disclosure on the most
        # sensitive thing the app collects, and App Review rejects on precisely this.
        NSCameraUsageDescription: eno uses the camera to photograph items you list, and to capture your identity document and a selfie when you verify your account.
        NSMicrophoneUsageDescription: Record sound when you capture a video for your listing.
        NSLocationWhenInUseUsageDescription: Fill your listing's area from your current location. Used once when you tap it; your location is not stored.
        CFBundleURLTypes:
          - CFBundleURLName: forum.eno.app.oauth
            CFBundleURLSchemes: [enoforum]
  # Unit tests (audit #11) — pure Core logic (ImageURL, Format, RecentStore,
  # ListingCard badge rules, APIErrorBody). Swift Testing (@Test). Run:
  # xcodebuild test -scheme Eno -destination 'platform=iOS Simulator,name=iPhone 16'
  EnoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EnoTests]
    dependencies:
      - target: Eno
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Eno:
    build:
      targets:
        Eno: all
        EnoTests: [test]
    test:
      targets: [EnoTests]
    run:
      config: Debug
  # Build/run the services edition:
  #   xcodebuild -scheme EnoForum -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
  EnoForum:
    build:
      targets:
        EnoForum: all
    run:
      config: Debug
