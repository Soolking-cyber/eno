# ─────────────────────────────────────────────────────────────────────────────
# eno · the two application containers on 162.4.176.208
#
# ⛔ THIS FILE EXISTS BECAUSE THE DEFINITION USED TO LIVE NOWHERE. Both containers
# were started by hand with `docker run --env-file …` and their only record was the
# metadata inside the running container. Anyone who removed one had to reconstruct
# the flags from `docker inspect` — and a wrong reconstruction here is not a restart
# bug, it is a LICENSING failure (see the port mapping below).
#
#   docker compose -f apps.compose.yml up -d
#
# ⚠️ ENV IS READ AT CONTAINER CREATE, NOT AT REQUEST TIME. Editing a file under
# /opt/eno/secrets does nothing until the container is recreated. `restart` is not
# enough; it must be `up -d` after the file changes.
services:
  # ⛔ THE LICENSING BOUNDARY IS THE image↔port PAIRING. `NEXT_PUBLIC_ENO_EDITION` is
  # inlined at BUILD time, so eno-vn:local IS the marketplace and eno-forum:local IS
  # the services edition — no runtime flag can talk one into behaving as the other.
  # nginx routes eno.vn → 3001 and eno.forum → 3002. Cross them and the licensed sàn
  # TMĐT serves visa, itinerary and PayPal wholesale.
  eno-vn:
    image: eno-vn:local
    container_name: eno-vn-app
    env_file: [/opt/eno/secrets/eno-vn.env]
    # ⛔ THE OPTIMIZER CACHE SURVIVES THE DEPLOY, AND UNTIL 2026-09-14 IT DID NOT.
    # `docker inspect eno-vn-app` returned `Mounts: []`: 173MB / 3,330 encoded variants sat in
    # the container layer and every `up -d --force-recreate` threw them away. Measured on this
    # box, a cold AVIF encode is ~505ms against ~120ms served warm, and the feed asks for six
    # widths per photo — so a deploy silently handed the next visitors ~3s of CPU per new image,
    # eight of them at once on eight Broadwell cores. That is the scroll stutter.
    # ⚠️ The volume is seeded from the image path, which the Dockerfile creates owned by
    # nextjs(1001). Do not replace this with a bare `docker volume create`: an empty root-owned
    # volume is unwritable by server.js and degrades to re-encoding everything, with no error.
    # ⚠️ UNBOUNDED, THIS FILLS THE DISK. 496,377 listing rasters x 6 widths at the measured
    # ~52KB/entry is ~156GB against 22GB free. eno-image-cache-prune.timer holds the ceiling;
    # the volume is only safe with that timer installed.
    volumes:
      - eno-vn-image-cache:/app/.next/cache/images
    # Loopback only — nginx is the sole way in, and the origin firewall assumes it.
    ports: ["127.0.0.1:3001:8080"]
    restart: unless-stopped
    networks: [supabase_default]
    # ⚠️ THE PROCESS BEING UP IS NOT THE APP BEING UP, but a request-level probe here
    # would run SSR every interval on a box that also builds. A listening socket is
    # the cheap half; eno-deploy.sh does the real HTTP check once, at deploy time.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  eno-forum:
    image: eno-forum:local
    container_name: eno-forum-app
    env_file: [/opt/eno/secrets/eno-forum.env]
    # Same argument as eno-vn above; measured 145MB / 3,259 entries, equally ephemeral.
    volumes:
      - eno-forum-image-cache:/app/.next/cache/images
    ports: ["127.0.0.1:3002:8080"]
    restart: unless-stopped
    networks: [supabase_default]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

# Created by the Supabase stack; the apps join it to reach Postgres and the envoy
# gateway by service name rather than over the public internet.
networks:
  supabase_default:
    external: true

# ⚠️ NAMED, NOT BIND-MOUNTED. A host path under /opt/eno would land inside the 47GB the backup
# and prune scripts already reason about; these are pure derived data that must never be backed
# up (see eno-backup.README.md, where the ISR cache was 1,585MB of a 1,616MB dump). Docker owns
# them, `docker volume inspect` finds them, and the prune timer reads the mountpoint from there.
volumes:
  eno-vn-image-cache:
  eno-forum-image-cache:

