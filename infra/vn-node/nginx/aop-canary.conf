# ─────────────────────────────────────────────────────────────────────────────
# AOP CANARY — temporary, delete once it has answered its one question.
#
# ⚠️ THIS EXISTS TO SETTLE A DISPUTE BETWEEN TWO REVIEWERS, NOT TO SHIP. Asked to
# refute the Authenticated Origin Pulls plan, one said `ssl_verify_client optional`
# is harmless before Cloudflare is presenting a certificate — it records the outcome
# in $ssl_client_verify and never rejects. The other said it is an immediate
# site-wide 525, because Cloudflare's edge aborts the handshake when it receives a
# CertificateRequest it was not configured for. Both cannot be right, and the second
# is expensive to be wrong about.
#
# www.eno.vn is where being wrong is free: it only 308-redirects to the apex. That is
# why it gets split out of the marketplace server_name for the duration.
#
# APPLY (on 162.4.176.208):
#   cp /etc/nginx/sites-enabled/eno.conf /root/eno.conf.pre-aop-canary
#   sed -i 's/^  server_name eno\.vn www\.eno\.vn;$/  server_name eno.vn;/' \
#     /etc/nginx/sites-enabled/eno.conf
#   # append the log_format at http level and the server block below, then:
#   nginx -t && nginx -s reload
#
# READ THE ANSWER:
#   curl -s -o /dev/null -w '%{http_code}\n' https://www.eno.vn/
#   tail /var/log/nginx/aop-canary.log
#
#   308 + ssl_client_verify=NONE → the edge finishes the handshake and sends nothing.
#                                  Claim refuted; the real rollout is safe.
#   525                          → claim holds. Revert, and `optional`-first is dead:
#                                  Cloudflare has to be enabled first, with the origin
#                                  going straight from no verification to `on`.
#
# REVERT (2 seconds):
#   cp /root/eno.conf.pre-aop-canary /etc/nginx/sites-enabled/eno.conf && nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

# http context — goes beside the existing `map $http_upgrade`, not inside a server.
log_format aopcanary '$remote_addr $host "$request" $status ssl_client_verify=$ssl_client_verify ssl_protocol=$ssl_protocol';

server {
  listen 80;  listen [::]:80;
  listen 443 ssl;  listen [::]:443 ssl;
  server_name www.eno.vn;
  include /etc/nginx/snippets/eno-ssl.conf;

  # ⛔ `optional`, NEVER `on`, in a canary. `on` is the setting that answers HTTP 400
  # to every request when no certificate arrives — which is precisely the outage this
  # block is trying to avoid provoking. nginx still requires ssl_client_certificate
  # here: it is what fills the CA list in the CertificateRequest.
  ssl_client_certificate /etc/nginx/ssl/eno-origin-pull-ca.pem;
  ssl_verify_client optional;

  access_log /var/log/nginx/aop-canary.log aopcanary;
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/snippets/eno-proxy.conf;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }
}
