# ─────────────────────────────────────────────────────────────────────────────
# eno · nginx on the VN origin (162.4.176.233; 162.4.176.208 until the 2026-09-20 migration)
#
# Cloudflare → this box. Three layers keep it that way and this file is the
# third, not the first: ufw admits 80/443 only from Cloudflare's published
# ranges; src/proxy.ts refuses every /api/* request lacking a header a
# Cloudflare Transform Rule injects; and the default_server below answers
# nothing at all to a request that names a host we do not serve.
#
#   eno.vn      → 127.0.0.1:3001   (marketplace edition — licensed sàn TMĐT)
#   eno.forum   → 127.0.0.1:3002   (services edition — visa / itinerary / PayPal)
#   sb.eno.vn   → 127.0.0.1:8000   (supabase envoy: auth, rest, storage, realtime)
#
# ⛔ THE LICENSING BOUNDARY IS THE server_name → PORT MAPPING BELOW. One codebase
# is built twice; `NEXT_PUBLIC_ENO_EDITION` is inlined at build time, so :3001 IS
# the marketplace and :3002 IS the services edition — no request can talk :3001
# into serving /visa. Point one of these at the wrong port and eno.vn serves the
# services edition wholesale. Verified by route, not by flag: /visa and
# /itinerary must 404 on eno.vn and /itinerary must 200 on eno.forum.

# AOP log. verify=SUCCESS: the TLS request carried the client certificate Cloudflare presents for
# our zones. ENFORCED now (`ssl_verify_client on` in eno-ssl.conf): a 443 request without it gets 400.
# verify=- : the Cloudflare Tunnel listener (127.0.0.1:8181, plain HTTP on loopback, no TLS step).
log_format aop '$remote_addr $host "$request" $status verify=$ssl_client_verify';

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ⛔ THE GoTrue AUTHORIZE GUARD (Sign in with Apple plan A2 / D21, 2026-10-08; used by the sb.eno.vn server).
# GoTrue v2.189.0 takes as redirect_to any scheme on SITE_URL's host (evil://eno.vn/…) and any loopback IP
# (internal/utilities/request.go), and runs the IMPLICIT flow — tokens, provider_refresh_token included, in the
# redirect URL — when no code_challenge is sent. eno only ever starts PKCE flows that come back to its own https
# origins, so everything else is refused before GoTrue sees it. $arg_redirect_to is the RAW value: supabase-js
# percent-encodes "://" and "/", so both spellings are allowed.
map $arg_redirect_to $eno_authz_redirect_ok {
  default 0;
  "~*^https(%3A|:)(%2F|/)(%2F|/)(www\.)?eno\.(vn|forum)(%2F|/)" 1;
}
# …and PKCE as S256 only (commit gate C1, codex): with `plain` the challenge IS the verifier, so whoever reads the
# authorize URL can redeem the code. supabase-js always sends s256; the RAW value, so an escaped one is refused too.
map $arg_code_challenge_method $eno_authz_s256 {
  default 0;
  "~*^s256$" 1;
}
# ⛔ …AND ONLY WHEN nginx AND GoTrue READ THE SAME QUERY. nginx's $arg_* finds a name case-insensitively and
# never decodes it; GoTrue (Go url.ParseQuery) is case-sensitive, decodes names, drops a pair holding ';' or a
# malformed escape, and then ignores the whole form for redirect_to. Each line below is a way to show nginx one
# value and GoTrue another — e.g. Redirect_To=https://eno.vn/&redirect_to=evil://eno.vn/ — and supabase-js
# never sends any of them, so they are refused outright.
map $args $eno_authz_args_ambiguous {
  default 0;
  "~;" 1;                                        # Go drops the pair; nginx keeps it in the value
  "~%(?![0-9A-Fa-f]{2})" 1;                      # a malformed escape: Go drops the pair, and redirect_to with it
  "~(^|&)[^=&]*%" 1;                             # an escaped name: Go decodes it, nginx does not
  "~(^|&)[^=&]*[A-Z]" 1;                         # an upper-case name: nginx's $arg_* matches it, Go does not
  "~(^|&)(redirect_to|code_challenge)(&|$)" 1;   # a bare name: Go reads it as empty, nginx skips it
}

# ⛔ RESTORE THE REAL VISITOR IP BEFORE ANY VHOST SEES IT. Generated by
# /opt/eno/bin/gen-cloudflare-realip.sh (in the repo alongside this file).
# Without it $remote_addr is a Cloudflare edge IP, and while the app reads
# `cf-connecting-ip` first — so limits still work — its documented fallback is
# `x-real-ip`, which we would then be filling with an edge IP. See the script.
include /etc/nginx/snippets/eno-realip.conf;

# ⚠️ NO HTTP/2 HERE, ON PURPOSE. Cloudflare speaks h2/h3 to the visitor and
# HTTP/1.1 to the origin, so h2 on this hop buys nothing — and nginx 1.24 wants
# it as a `listen` option (`listen 443 ssl http2;`), not the 1.25+ `http2 on;`
# directive, which fails config-test with "unknown directive".

# ⛔ AN UNKNOWN HOST GETS NOTHING. 444 closes the connection without a response.
# Without these two blocks the first server below silently becomes the default and
# would answer for any Host at all — including, on eno.vn's port, the services
# edition.
# ⚠️ THIS IS NOT STEALTH, AND AN EARLIER VERSION OF THIS COMMENT CLAIMED IT WAS.
# On :443 the TLS handshake completes BEFORE nginx can return anything, so a
# scanner already has origin.crt — whose SANs spell out eno.vn, *.eno.vn,
# eno.forum and *.eno.forum. What 444 buys is that no CONTENT is served to a
# request that names a host we do not host; it does not hide the host list.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  include /etc/nginx/snippets/eno-ssl.conf;
  return 444;
}

# ── marketplace ──────────────────────────────────────────────────────────────
server {
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name eno.vn www.eno.vn;
  include /etc/nginx/snippets/eno-ssl.conf;
  # ⚠️ RETAINED 400 DAYS by /etc/logrotate.d/eno-nginx (logrotate-nginx.conf) — per counsel review,
  # pending lawyer confirmation, of Decree 333/2026/ND-CP Art. 20(3), system logs >= 12 months
  # (source, Art 20: https://english.luatvietnam.vn/decree-no-333-2026-nd-cp-dated-august-19-2026-of-the-government-detailing-a-number-of-articles-and-measures-for-implementation-of-the-law-on-cyberse-445089-doc1.html ).
  # Its glob is /var/log/nginx/*.log and does NOT recurse: every access_log/error_log in this file
  # must stay directly in /var/log/nginx/ and end in .log, or it silently falls out of retention.
  access_log /var/log/nginx/eno-vn.access.log;
  # ⚠️ Tracks the 50MB listing-video ceiling with multipart overhead. nginx
  # rejects at 413 BEFORE the app sees the request, so a limit lower than the
  # app's own produces an error the app cannot explain to the seller.
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/snippets/eno-proxy.conf;
    # ~210s video encode. Cloudflare gives up around 100s on this plan, so the
    # edge kills a long request first; this is here so nginx never is the one.
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }
}

# ── services ─────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name eno.forum www.eno.forum;
  include /etc/nginx/snippets/eno-ssl.conf;
  access_log /var/log/nginx/eno-forum.access.log;
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3002;
    include /etc/nginx/snippets/eno-proxy.conf;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }
}

# ── supabase ─────────────────────────────────────────────────────────────────
# This is the hostname the BROWSER calls: NEXT_PUBLIC_SUPABASE_URL is
# https://sb.eno.vn in BOTH editions, so it is as public as the app itself.
# ⚠️ IT CARRIES REALTIME, WHICH IS WEBSOCKETS. The Upgrade/Connection pair in the
# proxy snippet is what makes chat, live counters and presence work; without it
# the socket never establishes and the app degrades to silence, not to an error.
server {
  # ⛔ NO `listen 80` ON THIS VHOST. Client-certificate verification is a TLS
  # property, so a request arriving on port 80 skips it entirely — leaving :80
  # open here would be a complete bypass of the mTLS this hostname exists to
  # enforce. Cloudflare reaches us on 443 (both zones are SSL mode Full), so
  # nothing legitimate needs port 80, and the default_server answers 444 there.
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name sb.eno.vn;
  include /etc/nginx/snippets/eno-ssl.conf;
  # ⛔ ENABLE ONLY AFTER Cloudflare holds our client certificate and sb.eno.vn is
  # associated with it. Server-side app calls hairpin through Cloudflare (checked:
  # the container resolves sb.eno.vn to 2606:4700:…), so they carry the cert too.
  #   include /etc/nginx/snippets/eno-origin-pull.conf;
  access_log /var/log/nginx/eno-sb.access.log;
  client_max_body_size 64m;
  # ⛔ THE AUTHORIZE GUARD — the two maps at the top of this file say why. A case-blind PREFIX regex, so
  # /auth/v1/authorize/, /AUTH/V1/AUTHORIZE and /auth/v1/authorize;x cannot route around an exact match (nginx
  # matches the decoded, slash-merged URI; proxy_pass without a URI forwards the original). GoTrue serves
  # /authorize on GET only, so the query is the whole request. ⚠️ GoTrue reads a `redirect_to` request HEADER
  # before the query, and nginx drops that header only through two defaults: a header name holding an underscore
  # is invalid, and an invalid header is ignored. Neither directive may ever be set — the I4 check in
  # infra/vn-node/apple-signin.md looks for both, comments cut (this one names them in words on purpose).
  location ~* ^/+auth/+v1/+authorize {
    if ($eno_authz_args_ambiguous = 1) { return 400; }
    if ($eno_authz_redirect_ok = 0)    { return 400; }
    if ($arg_code_challenge = "")      { return 400; }
    if ($eno_authz_s256 = 0)           { return 400; }
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/snippets/eno-proxy.conf;
  }
  # Manual identity linking (GOTRUE_SECURITY_MANUAL_LINKING_ENABLED) is off; this keeps its OAuth start closed even
  # if that changes, until the same redirect rules have been reviewed for it.
  location ~* ^/+auth/+v1/+user/+identities/+authorize { return 403; }
  location / {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/snippets/eno-proxy.conf;
    # ⚠️ Realtime holds a socket open. A short read timeout tears it down on a
    # quiet channel and the client reconnect-storms.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# ── shop storefronts ─────────────────────────────────────────────────────────
# A verified shop's handle answers as its own subdomain: apple.eno.vn serves that
# shop's catalogue (owner, 2026-08-30). The app decides WHICH shop and whether it
# may have a subdomain at all; nginx's only job is to hand the request to the
# right EDITION.
#
# ⛔ THE LICENSING BOUNDARY IS THIS MAPPING, exactly as for the two vhosts above:
# *.eno.vn goes to 3001 (marketplace) and *.eno.forum to 3002 (services). Cross
# them and the licensed sàn TMĐT serves visa surfaces under its own domain. Each
# wildcard stays inside its own zone for the same reason the apexes do.
#
# ⚠️ EXACT server_name BEATS A WILDCARD IN nginx, WHICH IS WHAT KEEPS sb.eno.vn
# SAFE. nginx resolves exact names first, then leading-wildcard names, then
# regex, then default_server — so sb.eno.vn (the Supabase gateway, with its own
# mTLS vhost below) and www.eno.vn continue to match their own blocks and never
# reach these. That ordering is a documented nginx guarantee, not a side effect
# of where these blocks sit in the file; the app's INFRA_SUBDOMAINS list refuses
# the same names a second time, so the two layers agree.
#
# ⚠️ NO CERTIFICATE WORK WAS NEEDED, and it is worth recording why: the
# Cloudflare Origin CA cert at /etc/nginx/ssl/origin.crt already carries
# *.eno.vn and *.eno.forum in its SANs (to 2041), and both zones' Universal
# certs already cover the same wildcards at the edge. Full (strict) therefore
# validates on day one.
#
# ⚠️ AN UNKNOWN OR UNVERIFIED SHOP IS A 404 FROM THE APP, NOT A 444 FROM HERE.
# That is deliberate: the app is the only layer that knows whether a handle
# belongs to a business that is verified TODAY, and it answers with the ordinary
# not-found page so a subdomain probe cannot tell a real shop from an absent one.
server {
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name *.eno.vn;
  include /etc/nginx/snippets/eno-ssl.conf;
  access_log /var/log/nginx/eno-vn-shops.access.log;
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/snippets/eno-proxy.conf;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }
}

server {
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name *.eno.forum;
  include /etc/nginx/snippets/eno-ssl.conf;
  access_log /var/log/nginx/eno-forum-shops.access.log;
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3002;
    include /etc/nginx/snippets/eno-proxy.conf;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }
}
