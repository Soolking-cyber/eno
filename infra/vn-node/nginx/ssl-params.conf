# Cloudflare Origin CA certificate — valid to 2041, and trusted ONLY by
# Cloudflare. That is the point: it is not a public certificate, so it is useless
# to anyone reaching this box directly, and there is no renewal cron to forget.
# ⚠️ TARGET SSL MODE IS "Full (strict)"; both zones read "Full" as of 2026-08-21.
# Full encrypts CF→origin but does not verify this certificate. On "Flexible" CF
# would talk cleartext and the certificate would be bypassed entirely.
ssl_certificate     /etc/nginx/ssl/origin.crt;
ssl_certificate_key /etc/nginx/ssl/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:eno:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
