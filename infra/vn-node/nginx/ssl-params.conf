# Cloudflare Origin CA certificate — valid to 2041, and trusted ONLY by
# Cloudflare. That is the point: it is not a public certificate, so it is useless
# to anyone reaching this box directly, and there is no renewal cron to forget.
# ⚠️ TARGET SSL MODE IS "Full (strict)"; both zones read "Full" as of 2026-08-21.
# Full encrypts CF→origin but does not verify this certificate. On "Flexible" CF
# would talk cleartext and the certificate would be bypassed entirely.
ssl_certificate     /etc/nginx/ssl/origin.crt;
ssl_certificate_key /etc/nginx/ssl/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:eno:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ── Authenticated Origin Pulls — ENFORCING ───────────────────────────────────
# `on` answers 400 to any TLS request without a client certificate signed by OUR CA,
# eno-origin-pull-ca.pem ("eno origin-pull CA", 2026-2036; the leaf Cloudflare presents for
# our zones is CN=cloudflare-origin-pull.eno.vn). NOT the global cf-origin-pull-ca.pem:
# every Cloudflare customer presents that one, so it cannot bind a request to OUR zones.
# Enablement order and history: infra/vn-node/aop-runbook.md (measure with `optional`, then enforce).
# ⛔ Never relax this to `optional` or `off` without the owner: it reopens the origin to any
# Cloudflare zone pointed at this IP. The tunnel listener (127.0.0.1:8181) has no TLS and so no
# client-certificate step; it is loopback-only (eno-tunnel.conf).
ssl_client_certificate /etc/nginx/ssl/eno-origin-pull-ca.pem;
ssl_verify_client on;
access_log /var/log/nginx/aop.log aop;
