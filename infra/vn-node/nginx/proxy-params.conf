# Shared by every eno vhost. ⛔ EDIT HERE, NEVER IN ONE VHOST — the three hosts
# drifting apart is exactly how the edition split silently breaks.
proxy_http_version 1.1;

# ⚠️ PASS THE REAL HOST. Checked against src/lib/edition.ts before writing this,
# because the obvious guess is wrong: the edition is NOT chosen from this header.
# `NEXT_PUBLIC_ENO_EDITION` is inlined at BUILD time (Turbopack substitutes it
# statically), so each container IS one edition and the licensing boundary is the
# server_name → port mapping in eno.conf, not this line.
# What this header does control is everything the app derives from its own
# identity: canonicalAuthOrigin(), canonical tags, OG image URLs, OAuth
# redirect_uri. Hardcode it and sign-in breaks on one of the two domains while
# the pages still render — which is the hard kind of bug to see.
proxy_set_header Host              $host;

proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# ⚠️ HARDCODED https, NOT $scheme. Cloudflare terminates TLS for the visitor and
# may reach this box on either 80 or 443, so $scheme reports the CF↔origin hop,
# not the browser's. Every absolute URL the app builds — OAuth redirect_uri,
# canonical tags, OG images — would come out http:// and the redirect_uri would
# stop matching what Google has registered.
proxy_set_header X-Forwarded-Proto https;

# WebSockets (Realtime on sb., and Next's dev-style HMR paths in general).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# ⚠️ OFF IS DELIBERATE: Next streams its RSC payload and the AI concierge streams
# tokens. With buffering on, nginx holds the response until a buffer fills and
# the visitor watches a spinner instead of text arriving.
proxy_buffering off;

# ⛔ TIMEOUTS ARE NOT SET HERE, DELIBERATELY. nginx rejects a directive repeated
# in the same context, and `include` splices into the location block — so a
# timeout here plus the longer one sb.eno.vn needs for its Realtime sockets is
# "directive is duplicate" and a config that will not load at all. Each vhost
# states its own.
