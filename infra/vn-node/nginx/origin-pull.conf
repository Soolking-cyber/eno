# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Authenticated Origin Pulls — mTLS between Cloudflare and this box.
#
# ⛔ THIS FILE IS NOT INCLUDED BY eno.conf YET, AND MUST NOT BE UNTIL AUTHENTICATED
# ORIGIN PULLS IS ENABLED ON THE ZONE. The full sequence, the disputed step and the
# rollbacks live in ../aop-runbook.md; this is only the origin half of it.
#
# ⚠️ THE SCOPE CHANGED AFTER THE CUTOVER: ZONE-LEVEL, NOT PER-HOSTNAME. When this was
# first specced, only vn-test.eno.vn resolved to this box and eno.vn still pointed at
# the Google load balancer, which does not do mTLS — so AOP had to be scoped to one
# hostname or the GCLB would have been handed a certificate it could not verify. Every
# proxied record in both zones now terminates on this nginx, so that constraint is gone
# and zone-level is the simpler, safer setting. It also sidesteps the plan gate: two
# reviewers independently put per-hostname customer certificates above the Free plan.
#
# Order is the whole risk here:
#
#   1. upload OUR cert+key to the zone and enable AOP → CF starts PRESENTING it.
#      Harmless while the origin ignores it.
#   2. add this file with `ssl_verify_client optional` (NOT `on`) and log
#      $ssl_client_verify → measure that CF really is presenting it, on every
#      hostname, for pages AND for sb.eno.vn websockets.
#   3. only when every hostname logs SUCCESS, flip `optional` to `on`.
#
#   Reversed, nginx demands a certificate Cloudflare is not yet sending and every
#   request through the edge breaks. ⚠️ It does NOT fail the handshake: nginx
#   completes TLS and answers HTTP 400 "No required SSL certificate was sent", so
#   the symptom is a site returning 400 to everyone, not a connection error.
#
# ⛔ WHAT THIS DOES *NOT* CLOSE, AND AN EARLIER VERSION OF THIS FILE CLAIMED IT DID.
# The CA below is Cloudflare's GLOBAL origin-pull CA, shared by every Cloudflare
# customer. Verifying against it proves the connection came from Cloudflare — NOT
# that it came from OUR zone. An attacker who points their own Cloudflare zone at
# 162.4.176.208 and sends `Host: eno.vn` still presents a certificate this CA
# signs, and still gets in. Two reviewers caught the overclaim independently.
#
# WHAT IT DOES CLOSE, which is real but smaller: anything arriving from a
# Cloudflare-range address that is not genuine CF proxy traffic — Workers egress,
# other services in those ranges, a compromised host inside them. the ENO-WEB chain
# limits us to those ranges; this makes "from a Cloudflare IP" mean "from the
# Cloudflare edge, doing a proxy pull".
#
# ⛔ THE ACTUAL FIX FOR ZONE-BINDING IS A CUSTOM ORIGIN-PULL CERTIFICATE: upload
# our own cert+key to the zone (`POST /zones/{id}/origin_tls_client_auth`) and
# point ssl_client_certificate at OUR CA instead of Cloudflare's global one. Then
# only our zone's edge can complete the handshake. Until that is done, the
# Transform-Rule header check in src/proxy.ts remains the only thing that actually
# binds a request to our zone — and it covers /api/* only, not page routes.
#
# The leaf Cloudflare presents was reissued 2026-08-22 with real extensions
# (CA:FALSE, keyUsage digitalSignature+keyEncipherment, extendedKeyUsage clientAuth).
# The first one had NO extensions at all. Both reviewers said that is legal — an
# absent EKU means "any purpose" — so this is insurance against Cloudflare's upload
# validation, not a fix for a rejection anyone observed.
#
# ⚠️ THE CA EXPIRES 2029-11-01. Re-download from
# https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# sha256 c14fed0ce5210db0719fea11d1f10b33750dc17d609aeaf47c75e9eff0d7b843
# (verified 2026-08-22 — compare the WHOLE digest; a prefix match is not a match).
# ⛔ OUR CA, NOT CLOUDFLARE'S SHARED ONE. The global
# cf-origin-pull-ca.pem is also on this box, and pointing at it would accept a
# certificate from ANY Cloudflare customer — giving up exactly the zone-binding
# this file exists for. Left as the default here so the safe choice is the one you
# get by not thinking about it.
ssl_client_certificate /etc/nginx/ssl/eno-origin-pull-ca.pem;
# ⚠️ START AT `optional` AND MEASURE. `optional` requests a certificate, records the
# outcome in $ssl_client_verify and NEVER rejects; `on` is what returns 400 to every
# request if Cloudflare is not actually presenting one. Do not skip the middle step —
# a reviewer's sharpest point was that SUCCESS in your own logs only proves the colos
# YOU exited through are configured, so enforcement can fail geographically.
ssl_verify_client optional;
