# /etc/nginx/conf.d/eno-header-buffers.conf (http level: at server level nginx may use the default server's value).
# ⛔ nginx's default is 8k per header, and 8.3 KB of Cookie answered 400 "Request Header Or Cookie Too Large" (measured 2026-11-04). A Facebook sign-in on a connected
# account copies Facebook's name, email and picture links into the JWT, the session's user and each identity, which tipped a real browser over, and then every page
# of the site answered 400 until the cookies were cleared. 16k matches Node's default --max-http-header-size behind it.
large_client_header_buffers 4 16k;
