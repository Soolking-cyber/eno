# ─────────────────────────────────────────────────────────────────────────────
# eno · nginx log retention on the origin — installed as /etc/logrotate.d/eno-nginx
# by infra/vn-node/install-logrotate.sh (bootstrap.sh and origin-bootstrap.sh call it).
#
# ⛔ 400 DAYS, BECAUSE THE DECREE SAYS TWELVE MONTHS — per counsel review, PENDING LAWYER CONFIRMATION.
# Decree 333/2026/ND-CP (in effect 2026-08-19, Art. 30), Art. 20(3): "System logs serving
# investigation and handling of acts violating the law on cybersecurity as specified at Point b,
# Clause 2, Article 25 of the Law on Cybersecurity shall be stored for at least 12 months."
# Art. 16(6)(c) sets the same 12-month floor for system logs generally. Source (LuatVietnam's
# English translation, not the official Vietnamese text):
#   https://english.luatvietnam.vn/decree-no-333-2026-nd-cp-dated-august-19-2026-of-the-government-detailing-a-number-of-articles-and-measures-for-implementation-of-the-law-on-cyberse-445089-doc1.html
#   (Art 20)
# Whether eno is in scope, and whether nginx access logs are the "system logs" meant there, is
# counsel's call and not this file's; keeping them 400 days is the conservative reading. ⚠️ Art.
# 16(6)(b) also lists what such logs must CONTAIN (account, login/logout times, IP, source port),
# and eno.conf's access_log lines use nginx's default `combined` format: client IP, yes; source port
# and eno account, no. That is a question for counsel too, not one a rotation policy can answer.
# The Ubuntu package's own /etc/logrotate.d/nginx keeps `rotate 14` — fourteen days — and that is
# what eno-vn.access.log, eno-forum.access.log, eno-sb.access.log (eno.conf) and the shared
# error.log were actually getting. 400 daily rotations is 12 months plus a month of slack for a
# missed run or a late request.
#
# ⚠️ THIS FILE SITS BESIDE THE PACKAGE'S /etc/logrotate.d/nginx AND WINS; IT NEVER EDITS IT.
# Both stanzas match /var/log/nginx/*.log. Two stanzas on one file is normally a logrotate ERROR
# ("duplicate log entry": the later stanza is skipped and the whole run exits 1). `ignoreduplicates`
# (logrotate >= 3.21.0; Ubuntu 24.04 ships 3.21.0), set on THIS stanza, makes logrotate drop every
# LATER match of a file this stanza already claimed. Measured 2026-10-01 with logrotate 3.21.0
# against nginx-common 1.24.0-2ubuntu7.18's own stanza (src/lib/nginx-logrotate.test.ts repeats it
# wherever a logrotate binary is available):
#   · as written:                      "nginx:1 ignore duplicate log entry for …", every file rotates
#                                      under "(400 rotations)", the package stanza says "No logs
#                                      found. Rotation not needed.", exit 0;
#   · without ignoreduplicates:        "error: nginx:1 duplicate log entry for …", exit 1;
#   · the flag on the package's stanza: the same error — logrotate checks the flag on the stanza
#                                      that claimed the file FIRST (config.c, LOG_FLAG_IGNOREDUPLICATES).
# FIRST is by file name: logrotate reads /etc/logrotate.d sorted (strcoll), and "eno-nginx" sorts
# before "nginx" in every locale. A rename must keep that true; install-logrotate.sh checks the
# outcome in logrotate's own dry run, not the name.
#
# ⛔ WHY NOT JUST REPLACE THE PACKAGE'S FILE (what this did until review, 2026-10-01).
# /etc/logrotate.d/nginx is a dpkg CONFFILE of nginx-common. Once it is edited, the next nginx-common
# that ships a changed copy makes dpkg ask which version to keep, and unattended-upgrades does not
# ask: it logs "Package nginx-common has conffile prompt and needs to be upgraded manually" and HOLDS
# THAT UPGRADE BACK — and nginx with it, since nginx Depends on nginx-common (= same version) — until
# a human answers. Security fixes included, silently. Deleting the package file is no better:
# unattended-upgrades counts a missing conffile as modified too (its conffile_prompt(), Debian
# #788049). Dpkg::Options --force-confold would let the upgrade through, but for every package on the
# box. Leaving the package's file byte-identical means dpkg never has a question to ask;
# install-logrotate.sh checks that it still is (dpkg's recorded md5).
#
# ⚠️ nginx RUNS ON THE HOST, NOT IN DOCKER (apt-installed by origin-bootstrap.sh / bootstrap.sh,
# managed by systemd; apps.compose.yml holds only the two app containers). So the reopen signal
# goes to the host master through the package's own init hook, exactly as the stock file does.
# `invoke-rc.d nginx rotate` sends USR1 to the pid in /run/nginx.pid: the master reopens every
# log file and workers follow. Without it nginx keeps writing into the RENAMED file, and with
# `delaycompress` that file is compressed and removed a day later — the logs are lost.
# ⚠️ Not `|| true` on the postrotate: a failed reopen must make logrotate report an error.
#
# ⚠️ DISK. 400 compressed days is real space (apps.compose.yml records ~22 GB free). install-logrotate.sh
# prints a projection from the files already on disk; re-check `du -sh /var/log/nginx` monthly
# for the first quarter. Shipping a copy OFF the box is a separate, still-open item.
# ─────────────────────────────────────────────────────────────────────────────
/var/log/nginx/*.log {
	ignoreduplicates
	daily
	rotate 400
	missingok
	notifempty
	compress
	delaycompress
	create 0640 www-data adm
	sharedscripts
	prerotate
		if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
			run-parts /etc/logrotate.d/httpd-prerotate; \
		fi \
	endscript
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
