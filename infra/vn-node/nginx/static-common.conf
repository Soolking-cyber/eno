# /etc/nginx/snippets/eno-static-common.conf — repo: infra/vn-node/nginx/static-common.conf
# Edition-NEUTRAL: no root, no port, nothing per site (check-static-boundary.sh enforces it).
# Content-Type comes from the http-level mime.types (js application/javascript, css text/css, woff2 font/woff2,
# svg image/svg+xml, ico image/x-icon, png image/png); Next appends charset=UTF-8 to js/css/json/txt only.
charset UTF-8;
charset_types application/javascript application/json text/css text/plain;

# What Next sends on /_next/static that changes behaviour for a subresource. No `always`: a miss falls back to
# the app in the named location, where none of these apply, so the app's 404 keeps its own no-store.
add_header Cache-Control "public, max-age=31536000, immutable";
add_header X-Content-Type-Options "nosniff";
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
# Lets an operator evict static alone if ever needed; deploys never purge this tag.
add_header Cache-Tag "eno-static";

gzip off;              # never compress on the fly here
gzip_static on;        # foo.js.gz beside foo.js (eno-static-sync.sh writes them), when the request accepts gzip
gzip_proxied any;      # gzip_static honours gzip_proxied; a Via header must not switch it off
gzip_vary on;          # Vary: Accept-Encoding wherever a .gz sibling exists (as Next does on compressible types)
# brotli_static on;    # ONLY after libnginx-mod-http-brotli-static is installed, `nginx -t` passes AND
                       # eno-static-sync.sh writes .br siblings (it does not today: q11 over a build takes minutes)

open_file_cache max=20000 inactive=10m;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors off;   # never cache "not found": a file copied a second ago is served at once
disable_symlinks on from=$document_root;   # a symlink is never followed → try_files falls back to the app
