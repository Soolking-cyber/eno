# /etc/nginx/snippets/eno-static-marketplace.conf — repo: infra/vn-node/nginx/static-marketplace.conf
# ⛔ INCLUDE ONLY IN A server{} WHOSE `location /` PROXIES TO 127.0.0.1:3001. Directory and fallback port are
# ONE edition and live in ONE file so they cannot be split; the twin snippet differs only in the edition name
# and the port. check-static-boundary.sh fails the reload if a server{} pairs this file with the other port.
#
# /_next/static/ — every recent build's files, from disk (written by /opt/eno/bin/eno-static-sync.sh at each
# deploy, before the container swap). Old HTML keeps hydrating after a deploy, so the deploy no longer has to
# purge Cloudflare everywhere (speed plan item 2, 2026-10-16).
location ^~ /_next/static/ {
  root /var/www/eno-static/marketplace$eno_static_off;   # file = root + $uri = …/marketplace/_next/static/…
  try_files $uri @eno_static_miss_marketplace;          # not on disk (or unreadable/symlink) → the SAME edition's app
  include /etc/nginx/snippets/eno-static-common.conf;
}
location @eno_static_miss_marketplace {
  proxy_pass http://127.0.0.1:3001;                     # no URI part: the original request URI is forwarded
  include /etc/nginx/snippets/eno-proxy.conf;
  add_header Cache-Tag "eno-static" always;
}
# /_next/image — the app's optimizer, unchanged; this location exists only to TAG its responses so the nightly
# erasure purge (eno-edge-nightly-purge.sh) can evict every image variant without touching JS/CSS/HTML.
location = /_next/image {
  proxy_pass http://127.0.0.1:3001;
  include /etc/nginx/snippets/eno-proxy.conf;
  add_header Cache-Tag "eno-img" always;
}
