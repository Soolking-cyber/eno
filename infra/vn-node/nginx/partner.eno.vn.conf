# ── partner.eno.vn — B2B partner profile (static, one self-contained index.html) ────────────────
# Source: ~/eno-profile/digital-v3 on the owner's Mac (npm run release). Owner, 2026-09-26: "deploy at
# partner.eno.vn the website". An EXACT server_name beats the *.eno.vn shop wildcard in eno.conf, so this
# host never reaches the app (see the note above that wildcard). Origin cert already carries *.eno.vn.
# Rollback: rm /etc/nginx/sites-enabled/partner.eno.vn.conf && nginx -t && systemctl reload nginx
server {
  listen 443 ssl;  listen [::]:443 ssl;
  listen 127.0.0.1:8181;   # Cloudflare Tunnel (cloudflared, loopback only, no AOP) — see eno-tunnel.conf
  server_name partner.eno.vn;
  include /etc/nginx/snippets/eno-ssl.conf;
  access_log /var/log/nginx/eno-partner.access.log;
  root /var/www/partner.eno.vn;
  charset utf-8;

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
  location = /index.html { return 301 https://partner.eno.vn/; }
  location / { return 301 https://partner.eno.vn/; }
}
