# ── Cloudflare Tunnel listener ───────────────────────────────────────────────
# cloudflared (eno-cloudflared@1/@2) dials OUT to Cloudflare and hands each request to
# 127.0.0.1:8181 as HTTP/1.1 with the visitor's Host. The eno vhosts in eno.conf (and
# partner.eno.vn.conf) carry an extra `listen 127.0.0.1:8181;`, so there is still ONE
# server_name -> port mapping (the licensing boundary). No AOP on this port: client-cert
# verification is a TLS property and this hop is loopback. Runbook:
# eno-wb1-backup/plan/cloudflare-tunnel-runbook.md
# ⛔ NEVER bind 8181 to anything but 127.0.0.1.

# ⛔ HTTP LEVEL ON PURPOSE. A set_real_ip_from inside a server block REPLACES the inherited
# Cloudflare list (eno-realip.conf) for that vhost and silently breaks real IP on 443.
set_real_ip_from 127.0.0.1;

# Unknown Host on the tunnel port gets nothing. The mail/img names are listed so that the
# `*.eno.vn` app vhost can never answer for them here (exact name beats wildcard).
server {
  listen 127.0.0.1:8181 default_server;
  server_name _ mail.eno.vn mx.eno.vn img.eno.vn img.eno.forum;
  access_log /var/log/nginx/eno-tunnel-refused.log;
  return 444;
}

# Stage-0 probe host: answers without the app and echoes what nginx saw.
server {
  listen 127.0.0.1:8181;
  server_name tunnel-check.eno.vn;
  access_log /var/log/nginx/eno-tunnel-check.log;
  client_max_body_size 64m;          # same ceiling as the app vhosts, for the upload test
  default_type text/plain;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
  location / { return 200 "tunnel ok host=$host client=$remote_addr port=$server_port cf_ray=$http_cf_ray xfp=$http_x_forwarded_proto\n"; }
}
