apply plugin: 'com.android.application'

/**
 * THE PLAY UPLOAD KEY — read from a file that is NEVER committed.
 *
 * ⛔ THE REPOSITORY IS PUBLIC, so neither the keystore nor any password may appear in this file.
 * `android/keystore.properties` and every *.jks / *.keystore are gitignored at the repo root;
 * android/.gitignore's own keystore lines ship COMMENTED OUT, which is why the root file states
 * them rather than trusting this one.
 *
 * ⚠️ ABSENT IS NOT AN ERROR. Without the properties file the release build stays UNSIGNED, exactly
 * as it was before this block existed — so CI, a fresh clone and anyone who only wants a debug
 * build are unaffected, and only the person actually cutting a release needs the key. A release
 * task that failed hard here would make the key a prerequisite for compiling the app.
 *
 * ⚠️ AN UNSIGNED .aab IS REFUSED BY PLAY WITH A GENERIC ERROR, so `verifyReleaseSigning` below
 * says so in words instead. Check before uploading:
 *     ./gradlew :app:verifyReleaseSigning
 *
 * Create the properties file as (values are examples; the file is gitignored):
 *     storeFile=/absolute/path/outside/this/repo/eno-upload.jks
 *     storePassword=…
 *     keyAlias=eno-upload
 *     keyPassword=…
 * ⛔ Keep the .jks OUTSIDE the working tree. A gitignore is a habit, not a guarantee; a path that
 * cannot be reached by `git add -A` is.
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasUploadKey = keystoreProps.containsKey('storeFile') && file(keystoreProps['storeFile']).exists()

android {
    namespace = "vn.eno.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        /**
         * ⛔ THE PLAY PACKAGE NAME, AND IT IS NOT THE JAVA `namespace` ABOVE. Google Play bound the
         * app entry to `eno.vn` before this bundle existed, and a package name is PERMANENT once
         * published — so the applicationId follows Play rather than the other way round (owner
         * decision, 2026-09-08, after being shown both options).
         * ⚠️ `namespace` STAYS `vn.eno.app`: it is the Java/R package, it never reaches Play, and
         * moving it would relocate MainActivity and every resource reference for no benefit. AGP
         * has kept the two separate since 7.x precisely so this is a one-line change.
         * ⚠️ It reads backwards on purpose — `eno.vn` is a DOMAIN, not reverse-domain — and that is
         * the cost of matching an entry that cannot be renamed.
         */
        applicationId "eno.vn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * ⚠️ MOST RELEASES OF THIS APP ARE NOT PLAY RELEASES. Capacitor runs in remote-server mode:
         * the WebView loads https://eno.vn, so every product change ships the moment the site
         * deploys and reaches installed apps with no store review at all. A new bundle is needed
         * only when the NATIVE shell changes — a plugin, a permission, the manifest, an icon,
         * targetSdk. Expect this number to move a handful of times a year, not per feature.
         *
         * ⛔ versionCode MUST INCREASE ON EVERY UPLOAD and can never be reused, even for a bundle
         * that was rejected or never rolled out. Play refuses a duplicate outright.
         */
        /**
         * ⚠️ 2, NOT 1, AND THE REASON IS THE WARNING DIRECTLY ABOVE — measured, not theorised.
         * versionCode 1 was uploaded 2026-09-08 and is now consumed by the closed- and open-testing
         * releases. Adding it to PRODUCTION on 2026-09-09 failed two ways at once: re-uploading the
         * same .aab was refused with "Version code 1 has already been used. Try another version
         * code", and Play's "Add from library" showed "No app bundles" because a consumed code is
         * not offered for promotion. Production therefore needs its own build, and every later
         * upload needs the next number again — a rejected or discarded bundle burns its code too.
         */
        // 3 (2026-09-14): the launcher icon at its real size, the name "Eno Marketplace", and the
        // EnoHaptics plugin — all native, so a new bundle. THIS ONE WENT TO PRODUCTION as 1.0.1.
        /**
         * ⛔ BUMP THIS THE MOMENT A BUNDLE IS UPLOADED, NOT WHEN THE NEXT ONE IS BUILT. The file sat
         * at `3` after 3 was uploaded and published, so it read as "the next number to use" while
         * actually naming a consumed one. On 2026-09-22 that cost a full build-sign-upload cycle:
         * Play refused the bundle with "Version code 3 has already been used" only at the very last
         * step, after the AAB was built and signed. The comment above it said "2 is the one on
         * production", which was true when written and had been wrong for eight days.
         * ⚠️ THE CONSOLE CANNOT BE TRUSTED TO SHOW YOU THE ANSWER EITHER: "Add from library" listed
         * only codes 1 and 2, because a code already attached to a release is not offered for
         * promotion. A code missing from that list is not a free code. The production track's
         * "Latest release" is the reliable tell.
         */
        // 4 (2026-09-22): launch screen with no wordmark, on the web's page floor, both themes.
        versionCode 4
        /** ⚠️ 1.0.2, because 1.0.1 IS ALREADY THE LIVE PRODUCTION RELEASE. Play allows two bundles
         *  to share a versionName, and the result is two different builds both called "1.0.1" in
         *  the release list, in crash reports and in the app's own about screen — indistinguishable
         *  exactly when someone is trying to tell them apart. The name is what humans read; the
         *  code is what Play enforces. Move both. */
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Play requires v2; v1 is off because minSdk is 24 and APK Signature Scheme v2
                // has covered every supported device since Android 7.
                enableV1Signing false
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            /**
             * ⚠️ SHRINKING IS OFF, DELIBERATELY, AND IT IS NOT AN OVERSIGHT TO "FIX" ON RELEASE DAY.
             * This is a remote-server WebView shell: essentially all of the app is served from
             * eno.vn, and the Java side is Capacitor's bridge plus its plugins. R8 buys almost
             * nothing here and reflection-driven plugin registration is exactly what it breaks —
             * in a way that shows up as a dead bridge on a user's phone, not as a build error.
             * Turn it on only with a signed release build installed and exercised on a device.
             */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/** Fails with the reason rather than letting an unsigned bundle reach the Play Console. */
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!keystorePropsFile.exists()) {
            throw new GradleException("android/keystore.properties is missing — the release build would be UNSIGNED and Play will refuse it. See docs/android-play-release.md.")
        }
        if (!hasUploadKey) {
            throw new GradleException("keystore.properties names storeFile=${keystoreProps['storeFile']}, which does not exist — the release build would be UNSIGNED.")
        }
        for (k in ['storePassword', 'keyAlias', 'keyPassword']) {
            if (!keystoreProps[k]) throw new GradleException("keystore.properties is missing ${k}.")
        }
        println "release signing: ${keystoreProps['keyAlias']} from ${keystoreProps['storeFile']}"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
