# Cloud Build — eno.vn marketplace: build → push → deploy to Cloud Run.
# Runs from the GitHub trigger on main (also manually:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD))
# Build-time env (NEXT_PUBLIC_* inlining + SSG data collection) is pulled from
# Secret Manager into a BuildKit secret mount — never a layer, never metadata.
steps:
  # Pull the deploy image WHILE the docker build runs. Measured: the cloud-sdk:slim
  # pull is ~40s of the ~62s deploy step, whereas cloud-builders/docker is already
  # cached on the worker (0.009s). Cloud Build bills wall-clock, so overlapping it
  # with the ~300s build makes it free and gets fixes to prod ~40s sooner.
  # `|| true` is load-bearing: this step runs under set -e, and a transient GCR blip
  # must never be able to stop a production deploy.
  - id: warm-deploy-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args: ['-c', 'docker pull gcr.io/google.com/cloudsdktool/cloud-sdk:slim || true']
  - id: build-push
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    secretEnv: ['BUILDENV']
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$BUILDENV" > /workspace/buildenv.env
        export DOCKER_BUILDKIT=1

        # ── LAYER CACHE FOR `npm ci` ───────────────────────────────────────────────────────
        # Measured on build 0d5925bf (313s total): `npm ci` alone is 76.9s of every build, run
        # from scratch because each Cloud Build gets a fresh worker with no layer cache.
        #
        # ⚠️ THE CACHE IMAGE IS THE `deps` STAGE, NOT THE FINAL IMAGE, and that is the whole
        # reason this is two builds instead of one. BUILDKIT_INLINE_CACHE only records metadata
        # for layers present in the EXPORTED image — and the runner stage copies just
        # `.next/standalone`, `.next/static` and `public`, so node_modules is nowhere in it.
        # Inline cache on the final image therefore could not restore `npm ci` no matter how it
        # was referenced; a reviewer proposed exactly that as a simplification and it would have
        # produced a cache that silently never hits. Building `--target deps` makes those layers
        # the exported image, which is what inline cache can actually describe.
        #
        # ⚠️ europe-west1, THE BUILD'S OWN REGION. Pointing --cache-from at the asia-southeast1
        # registry would pull 1.2 GB across continents on every build — ~$38/mo in egress, which
        # is more than the build minutes it saves.
        #
        # ⚠️ EVERY LINE HERE IS `|| true`. A cold cache, a missing repo or a registry blip must
        # only make the build SLOW, never fail it — this step sits in front of production deploys.
        CACHE=europe-west1-docker.pkg.dev/$PROJECT_ID/eno-build-cache/deps:latest
        docker pull "$$CACHE" || true
        docker build --target deps \
          --cache-from "$$CACHE" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$$CACHE" . || true
        docker push "$$CACHE" || true

        docker build \
          --cache-from "$$CACHE" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --secret id=buildenv,src=/workspace/buildenv.env \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:${_TAG} \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:latest \
          .
        rm -f /workspace/buildenv.env
        docker push --all-tags asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-push', 'warm-deploy-image']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - eno-vn
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:${_TAG}
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      - --quiet
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/eno-root-env/versions/latest
      env: BUILDENV
substitutions:
  _TAG: manual
options:
  # No machineType pin: the project lacks E2_HIGHCPU_8 quota in the trigger
  # region (europe-west1) — default machines build this in acceptable time.
  # Measured 2026-07-25, so nobody re-litigates it: only ~104s of a ~362s build is
  # non-CPU-bound, so an upgrade must cost <= $0.0105/min to break even. E2_HIGHCPU_8
  # is $0.016/min — it loses even with an infinitely fast CPU — and pinning any
  # machineType also forfeits the 2,500 free e2-medium build-minutes (~$7.50/mo).
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1800s
