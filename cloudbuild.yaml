# Cloud Build — eno.vn marketplace: build → push → deploy to Cloud Run.
# Runs from the GitHub trigger on main (also manually:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD))
# Build-time env (NEXT_PUBLIC_* inlining + SSG data collection) is pulled from
# Secret Manager into a BuildKit secret mount — never a layer, never metadata.
steps:
  # Pull the deploy image WHILE the docker build runs. Measured: the cloud-sdk:slim
  # pull is ~40s of the ~62s deploy step, whereas cloud-builders/docker is already
  # cached on the worker (0.009s). Cloud Build bills wall-clock, so overlapping it
  # with the ~300s build makes it free and gets fixes to prod ~40s sooner.
  # `|| true` is load-bearing: this step runs under set -e, and a transient GCR blip
  # must never be able to stop a production deploy.
  - id: warm-deploy-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args: ['-c', 'docker pull gcr.io/google.com/cloudsdktool/cloud-sdk:slim || true']
  - id: build-push
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    secretEnv: ['BUILDENV']
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$BUILDENV" > /workspace/buildenv.env
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=buildenv,src=/workspace/buildenv.env \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:${_TAG} \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:latest \
          .
        rm -f /workspace/buildenv.env
        docker push --all-tags asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-push', 'warm-deploy-image']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - eno-vn
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/eno-vn:${_TAG}
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      # ⚠️ DECLARED HERE, NOT LEFT TO WHATEVER THE SERVICE HAPPENS TO HOLD — this flag is load-bearing
      # and its absence is invisible.
      #
      # Next's `after()` runs its callback AFTER the response is flushed, and this app leans on that
      # in 53 places: Vertex AI Search indexing (src/lib/listing-index.ts), view + contact tracking,
      # review aggregation, translation caching, notification reads, video transcoding, dispute and
      # admin follow-ups. Under Cloud Run's DEFAULT cpu-throttling=true the instance's CPU is cut to
      # ~zero the moment the response completes, so that work is frozen and then discarded when the
      # instance is reclaimed. It does not fail loudly — it cannot even log, because logging needs
      # the CPU it just lost — so every one of those features degrades in silence.
      #
      # Found 2026-08-01 by diagnosing "the vertex indexer doesn't work": eno-vn was running
      # cpu-throttling=true while eno-forum ran with it disabled, because cloudbuild.services.yaml
      # declares --no-cpu-throttling for eno-forum and this file declared nothing for eno-vn. The
      # sibling deploy carried the setting and this one silently did not — the same
      # config-applied-to-one-service-and-not-the-other shape as the DATABASE_URL and x-eno-edge
      # cutover failures.
      #
      # NOT --min-instances: eno-forum pins one instance, but that bills continuously and `after()`
      # only needs CPU for the seconds between the response and the callback finishing, which an
      # instance that is alive-but-idle already has. Cold starts are a latency question, not this one.
      - --no-cpu-throttling
      - --quiet
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/eno-root-env/versions/latest
      env: BUILDENV
substitutions:
  _TAG: manual
options:
  # No machineType pin: the project lacks E2_HIGHCPU_8 quota in the trigger
  # region (europe-west1) — default machines build this in acceptable time.
  # Measured 2026-07-25, so nobody re-litigates it: only ~104s of a ~362s build is
  # non-CPU-bound, so an upgrade must cost <= $0.0105/min to break even. E2_HIGHCPU_8
  # is $0.016/min — it loses even with an infinitely fast CPU — and pinning any
  # machineType also forfeits the 2,500 free e2-medium build-minutes (~$7.50/mo).
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1800s
