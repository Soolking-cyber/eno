<!--
  eno.vn TILING WATERMARK — THE SAME OUTLINES AS public/logo-dotvn.svg.

  ⛔ IT USED TO BE <text font-family="system-ui,-apple-system,'Segoe UI',Arial">, WHICH IS WHY IT
  HAD TO CHANGE. An SVG <text> is set in whatever face the RENDERER happens to have, so this
  stamped "eno.vn" in Segoe UI on Windows, Helvetica on a Mac and something else again in a
  headless rasteriser — three typefaces for one wordmark, none of them the brand's. Outlines
  render identically everywhere and depend on no installed font.

  Provenance: the path is copied verbatim from public/logo-dotvn.svg, but the BOUNDS are the
  measured ink bbox, not that file's viewBox — the viewBox is the em/advance box and carries 22.6%
  transparent padding, which in a repeating tile shows up as the mark drifting off its own centre.
  Bounds live in src/lib/core/media.ts (MARK_W/H/X/Y); keep the two in step (Open Runde Bold 700,
  fontTools SVGPathPen, the font's own GPOS kerning). Regenerate BOTH from that one source —
  and see src/lib/core/media.ts, which bakes the same outlines into uploaded photos.

  ⚠️ NONZERO WINDING — DO NOT ADD fill-rule="evenodd". These are FONT outlines: the counters in
  `e`, `o` and `n` are wound opposite to their outer contours and drop out on their own. The old
  hand-drawn asset needed evenodd; this one fills the counters solid if it gets it.

  ⚠️ The two copies are a 1px offset shadow, not a duplicate — dark under white keeps the mark
  legible over both a bright sky and a dark interior. Keep them in this order.

  ⚠️ Tile is 200x138 and globals.css `.img-watermark` hardcodes `background-size:
  200px 138px`. Change one and you must change the other or the repeat seams.
-->
