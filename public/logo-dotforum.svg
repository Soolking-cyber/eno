<!--
  eno.forum WORDMARK — generated exactly like logo-dotvn.svg, from the app's own typeface.

  Owner, 2026-09-16: the launch reveal sweeps the wordmark. The services edition needs its own name in
  the same treatment, and it must be OUTLINES rather than live text — the splash paints before a webfont
  can load, and a wordmark in a fallback face is worse than no wordmark.

  Provenance — regenerate exactly like this if the font moves:
    face      src/fonts/open-runde-bold.woff2 (Open Runde Bold, 700, OFL-1.1, unitsPerEm 2816)
    text      "eno.forum", outlines via fontTools SVGPathPen, y flipped for SVG
    kerning   the font's own GPOS pair adjustments applied between glyphs
    fill      #0A66C2, baked, exactly like logo-dotvn.svg. ⚠️ currentColor WAS TRIED AND IS WRONG HERE:
              this file is referenced with <img src>, and an SVG loaded as an image has no parent to
              inherit from — currentColor resolves to the initial black, so the mark would go black on
              both themes. The brand blue reads on the light and the dark background alike.
    winding   nonzero, like its sibling: these are FONT outlines, so the counters in e/o/u are wound
              against their outers and drop out on their own. Do NOT add fill-rule="evenodd".
    viewBox   ink 14010x2174, padded vertically so the ink fills 76.7% of the box height and
              horizontally by the same 114.4 units logo-dotvn.svg carries — so "eno.vn" and
              "eno.forum" render at the same optical size from one height class.
              ⚠️ IT IS TALLER THAN ITS SIBLING BECAUSE OF THE f's ASCENDER (2174 units against 1586).
              That is the type, not a bug: sizing by height alone would make this mark's LETTERS
              smaller than eno.vn's. The splash sizes by width for that reason.

  ⚠️ SPELLS A DOMAIN, SO IT IS PER-EDITION: this names the SERVICES site and must never render on
  eno.vn, exactly as logo-dotvn.svg must never render on eno.forum. See src/lib/edition.ts.
-->
