<!--
  eno.vn WORDMARK — SET IN THE APP'S OWN TYPEFACE, NOT DRAWN BY HAND.

  Owner, 2026-08-13: "remake eno.vn svg with new font". The previous asset was hand-drawn
  beziers from before the app adopted Open Runde: square terminals and a pointed `v` that
  read as a different typeface everywhere it sat next to real UI text.

  Provenance — regenerate exactly like this if the font moves:
    face      src/fonts/open-runde-bold.woff2 (Open Runde Bold, 700, OFL-1.1, unitsPerEm 2816)
    text      "eno.vn", outlines converted with fontTools SVGPathPen, y flipped for SVG
    kerning   the font's own GPOS `kern` pairs applied between glyphs
    fill      #0A66C2, nonzero winding — these are FONT outlines, so the counters in `e`
              and `o` are wound opposite to their outer contours and drop out on their own.
              Do NOT add fill-rule="evenodd"; the old hand-drawn asset needed it, this
              one does not. (`n` has no counter.)
    viewBox   the tight ink box is 9128x1586. It is padded VERTICALLY to 2068.7 so the ink
              fills 76.7% of the box height — measured off the old asset, which filled
              exactly the same share. That is what keeps letters the same size on screen at
              an unchanged height class: at h-7 they are 21.5px tall, as before.
              ⚠️ HORIZONTALLY IT IS NOT MATCHED, AND MUST NOT BE. The old asset carried ~23%
              side padding (ink 1101 of 1431); this one is tight at 97.6%. Padding to match
              would only add empty width, because every call site sizes by HEIGHT with
              w-auto. The letters really are wider — Open Runde's "eno.vn" has an ink aspect
              of 5.755 against the hand-drawn mark's 4.787, i.e. ~20% wider at equal height
              — so the whole element still renders NARROWER than before: 126.6px at h-7
              against the old 133.6px, both clear of the rail's 160px max-width.
    ⚠️ SAME URL, DIFFERENT GEOMETRY. A deploy that ships new HTML while the edge still holds
              the old SVG letterboxes the mark. Purge Cloudflare with purge_everything (never
              by URL — see CLAUDE.md) when this ships.

  ⚠️ SPELLS A DOMAIN, SO IT IS PER-EDITION. This file names the licensed marketplace and must
  never render on eno.forum, which is a separate operator. See src/lib/edition.ts.
-->
