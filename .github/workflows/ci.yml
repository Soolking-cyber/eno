name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Fast pre-merge gate: typecheck + lint on PRs before they reach Vercel. The
    # Vercel build also enforces types now (ignoreBuildErrors:false), but this fails
    # the PR in ~1 min instead of waiting on a full deploy build.
    env:
      # Prisma reads these from the schema's datasource; generate doesn't connect,
      # so dummy values are fine for type generation in CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # i18n freshness: the pre-warm batch (ui-strings.ts) must include every UI
      # string, or new copy ships English to the 9 machine-translated languages.
      # Fails when someone adds copy without running `node scripts/gen-ui-strings.mjs`.
      - name: i18n string harvest is fresh
        run: |
          node scripts/gen-ui-strings.mjs
          git diff --exit-code src/generated/ui-strings.ts || (echo '::error::src/generated/ui-strings.ts is stale — run `node scripts/gen-ui-strings.mjs` and commit it.' && exit 1)

      - name: Test
        run: npx vitest run

      # ── Forum e2e ────────────────────────────────────────────────────────────────
      # Added 2026-07-21 after THREE forum specs sat red for weeks with nobody noticing:
      # nothing in CI ran them. This suite is the one that can run here honestly — it needs
      # no database and no marketplace API (FORUM_E2E_PREVIEW=1 serves static preview posts),
      # takes ~35s, and is deterministic.
      #
      # The ROOT guest suite is deliberately NOT here. Its specs read LIVE listing data, so a
      # production blip or a data change would turn PRs red for reasons the author cannot fix
      # — the fastest way to teach everyone to re-run until green. If we want that signal it
      # belongs on a schedule as a synthetic monitor, alerting a channel, not gating a merge.
      - name: Install Playwright browsers (forum e2e)
        run: npx playwright install --with-deps chromium
        working-directory: apps/forum

      - name: Forum e2e
        run: npx playwright test
        working-directory: apps/forum
        timeout-minutes: 12
        env:
          CI: 'true'
