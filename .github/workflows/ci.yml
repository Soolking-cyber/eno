name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Fast pre-merge gate: typecheck + lint on PRs before they reach Vercel. The
    # Vercel build also enforces types now (ignoreBuildErrors:false), but this fails
    # the PR in ~1 min instead of waiting on a full deploy build.
    env:
      # Prisma reads these from the schema's datasource; generate doesn't connect,
      # so dummy values are fine for type generation in CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # ⚠️ node_modules IS CACHED, and that is the actual fix. `cache: npm` above only caches
      # the npm registry cache (~/.npm) — but `ffmpeg-static`'s install script downloads a
      # SEPARATE GitHub release binary, which that cache never covers, so every single push
      # hit github.com and a 504 there turned main red for reasons no author could fix (twice
      # in fifteen minutes on 2026-07-24). With node_modules restored, the usual push installs
      # nothing at all.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      # Only runs on a cache MISS (a lockfile change). Retried, because the download it makes
      # is a third-party CDN fetch that fails transiently — and `--ignore-scripts` is NOT an
      # option here: esbuild, sharp and unrs-resolver all need their install scripts, so
      # disabling scripts wholesale would break lint and the build instead.
      # ⚠️ The `ok` flag is load-bearing: a bare `for … done` loop exits with the status of the
      # last command (the sleep), so a failing install would report SUCCESS.
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          ok=0
          for i in 1 2 3; do
            if npm ci; then ok=1; break; fi
            echo "npm ci failed (attempt $i/3) — retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          [ "$ok" = 1 ] || { echo '::error::npm ci failed after 3 attempts'; exit 1; }

      - name: Generate Prisma client
        run: npx prisma generate

      # ⚠️ EXPLICIT, BECAUSE postinstall DOES NOT RUN ON A CACHE HIT — AND THAT MADE THIS WORKFLOW
      # PASS OR FAIL ON THE STATE OF A CACHE RATHER THAN THE STATE OF THE CODE.
      # src/components/ui/icons.tsx and src/generated/icon-paths.ts are GENERATED and gitignored;
      # the only thing that produced them in CI was package.json's `postinstall`. The install step
      # above is skipped whenever the node_modules cache hits (its key is just the package-lock
      # hash), so on a warm cache neither file existed and `tsc` failed with ~200 x
      # "Cannot find module '@/components/ui/icons'" — in files the commit never touched. It went
      # unnoticed for as long as it did because a lockfile change, or a cache eviction, quietly
      # made the next run pass again.
      # Cheap (it reads @solar-icons/static and writes two files) and idempotent, so running it
      # unconditionally costs nothing and removes the cache from the correctness path entirely.
      - name: Generate icons
        run: node scripts/gen-icons.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      # ⚠️ `npm run lint`, NOT `npx eslint .` — the difference is the legal boundary.
      # package.json's lint script is `eslint . && design-lint.mjs && edition-lint.mjs`, and until
      # 2026-08-05 this step ran only the first third. So the design-canon linter and — far worse —
      # the EDITION linter, the gate that stops visa/itinerary/PayPal vocabulary reaching the
      # licensed eno.vn image, never ran on a pull request at all. They ran only inside
      # `npm run build`, which on main is the build that has ALREADY deployed: the guard fired after
      # the thing it guards against was live. Measured cost of the two extra scripts: 0.64s.
      - name: Lint
        run: npm run lint

      # i18n freshness: the pre-warm batch must include every UI string, or new copy ships
      # English to the 9 machine-translated languages. Fails when someone adds copy without
      # running `node scripts/gen-ui-strings.mjs`.
      #
      # ⚠️ BOTH CATALOGUES. One generator run writes TWO files — ui-strings.ts (shared) and
      # ui-strings.services.ts (visa/itinerary copy, aliased away on a marketplace build; see
      # the split note at the top of the generator). Until 2026-08-11 this step diffed only the
      # first, so a services-only copy change — the whole e-Visa wizard, the passport screens,
      # the trip planner — could go in stale and nothing anywhere would say so. It is a MERGE-time
      # hole specifically: the .claude hook that regenerates on edit only runs in this checkout,
      # so a commit authored anywhere else lands the drift in a file its author never opened.
      - name: i18n string harvest is fresh
        run: |
          node scripts/gen-ui-strings.mjs
          git diff --exit-code src/generated/ui-strings.ts src/generated/ui-strings.services.ts || (echo '::error::src/generated/ui-strings.ts / ui-strings.services.ts is stale — run `node scripts/gen-ui-strings.mjs` and commit BOTH files.' && exit 1)

      # Root↔forum visa sync pairs. The two apps deploy independently but decrypt and
      # RE-ENCRYPT the same visa_applications rows, and visaPayloadSchema is z.object() —
      # not .strict() — so zod silently STRIPS unknown keys. If root gains a payload field
      # and the forum copy has not moved, one forum admin edit deletes that field from the
      # ciphertext with no error and no log. This is the gate that stops that shipping.
      #   --check  : the pairs still match (unified diff on drift, unlike vitest's dump)
      #   node --test : the GENERATOR itself, which vitest cannot see (it globs src/**/*.test.ts)
      - name: Visa sync pairs are in lockstep
        run: |
          npm run sync:visa
          node --test scripts/sync-visa-pairs.test.mjs

      - name: Test
        run: npx vitest run

  # ── Forum e2e ──────────────────────────────────────────────────────────────────
  # Added 2026-07-21 after THREE forum specs sat red for weeks with nobody noticing:
  # nothing in CI ran them.
  #
  # A SEPARATE job, not steps inside `check`, because apps/forum has its own
  # package-lock.json and its own node_modules. The first attempt bolted the steps onto
  # `check` (which only runs `npm ci` at the repo root) and died with "couldn't find the
  # Next.js package from apps/forum/src/app" — the forum's deps were never installed.
  #
  # The ROOT guest suite is deliberately NOT here. Its specs read LIVE listing data, so a
  # production blip or a data change would turn PRs red for reasons the author cannot fix —
  # the fastest way to teach everyone to re-run until green. That signal belongs on a
  # schedule as a synthetic monitor, not on a merge gate.
  forum-e2e:
    name: Forum E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/forum
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/forum/package-lock.json

      # Same retry as the root job — the forum has no ffmpeg-static, but an npm registry blip
      # is the same class of failure and the same one-line cure. (No node_modules cache here:
      # this job installs from apps/forum and is not the one that was going red.)
      - name: Install forum dependencies
        run: |
          ok=0
          for i in 1 2 3; do
            if npm ci; then ok=1; break; fi
            echo "npm ci failed (attempt $i/3) — retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          [ "$ok" = 1 ] || { echo '::error::npm ci failed after 3 attempts'; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # workers=1 + retries=1 + fail-on-flaky: a shared runner is slower and more contended
      # than a laptop, and a suite that passes only on retry is a suite that will rot again.
      # Flaky counts as failure so the signal stays honest.
      - name: Run forum e2e
        run: npx playwright test --workers=1 --retries=1 --fail-on-flaky-tests
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: forum-playwright-report
          path: apps/forum/playwright-report/
          retention-days: 7
