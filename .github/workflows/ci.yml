name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Fast pre-merge gate: typecheck + lint on PRs before they reach Vercel. The
    # Vercel build also enforces types now (ignoreBuildErrors:false), but this fails
    # the PR in ~1 min instead of waiting on a full deploy build.
    env:
      # Prisma reads these from the schema's datasource; generate doesn't connect,
      # so dummy values are fine for type generation in CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .
