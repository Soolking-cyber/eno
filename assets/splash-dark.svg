<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732" role="img" aria-label="eno.vn">
  <!--
    Dark-scheme twin of assets/splash.svg — same wordmark, same 820x139 box at the same
    centre, so the two schemes cross-fade without the mark moving. Keep them in sync.

    COLOUR: the wordmark is #3b8ee6, NOT the #0a66c2 used on white. That is the app's own
    dark-surface brand token (the brand var inside `.dark` in globals.css — XML comments
    cannot contain a double hyphen, so it is spelled out rather than quoted). It is a
    contrast fix, not a preference: #0a66c2 on #1b1b1b measures ~2.9:1, which fails for
    something this size, while #3b8ee6 clears ~5.2:1. The old asset dodged this by putting
    the blue inside a tile with a white glyph on it; a bare wordmark has no such carrier.
  -->
  <rect width="2732" height="2732" fill="#1b1b1b"/>
  <svg x="956" y="1296" width="820" height="139" viewBox="249 35 1364 232">
    <g fill="#3b8ee6" fill-rule="evenodd">
      <!-- e -->
      <path d="M 476 150 C 476 86 426 35 363 35 C 300 35 249 86 249 150 C 249 214 301 265 364 265 C 415 265 459 233 471 193 L 397 193 C 389 203 377 208 364 208 C 342 208 323 195 315 173 L 472 173 C 475 165 476 158 476 150 Z M 315 127 C 323 107 343 93 364 93 C 385 93 403 106 412 127 Z"/>
      <!-- n -->
      <path d="M 509 263 L 509 151 C 509 85 558 35 622 35 C 686 35 734 85 734 151 L 734 263 L 669 263 L 669 151 C 669 122 650 101 622 101 C 594 101 574 122 574 151 L 574 263 Z"/>
      <!-- o -->
      <path d="M 886 35 C 950 35 1002 87 1002 150 C 1002 213 950 265 886 265 C 823 265 771 213 771 150 C 771 87 823 35 886 35 Z M 886 101 C 913 101 935 123 935 150 C 935 177 913 199 886 199 C 859 199 837 177 837 150 C 837 123 859 101 886 101 Z"/>
      <!-- . -->
      <path d="M 1065 199 A 33 33 0 1 1 1065 265 A 33 33 0 1 1 1065 199 Z"/>
      <!-- v -->
      <path d="M 1130 35 L 1242.5 267 L 1355 35 L 1287 35 L 1242.5 126.8 L 1198 35 Z"/>
      <!-- n -->
      <path transform="translate(879 0)" d="M 509 263 L 509 151 C 509 85 558 35 622 35 C 686 35 734 85 734 151 L 734 263 L 669 263 L 669 151 C 669 122 650 101 622 101 C 594 101 574 122 574 151 L 574 263 Z"/>
    </g>
  </svg>
</svg>
