# Cloud Build — eno.forum SERVICES edition: build → push → deploy to Cloud Run.
#
# ⚠️ THE SAME SOURCE AS cloudbuild.yaml, BUILT A SECOND TIME WITH A DIFFERENT IDENTITY. eno.vn is a
# licensed Vietnamese company (sàn TMĐT) and cannot offer e-visa, itinerary or PayPal services;
# eno.forum does. Both are this one repo. What separates them is entirely in the build-time env:
# NEXT_PUBLIC_ENO_EDITION picks the pageExtensions (so services-only routes exist at all) and
# NEXT_PUBLIC_APP_URL brands the artifact. next.config.ts refuses to build if those two disagree.
#
# ⚠️ WHY A SECOND IMAGE RATHER THAN ONE IMAGE WITH A RUNTIME FLAG — the question everyone asks when
# they see the bill, so the answer lives here. Three things are decided at BUILD time and cannot be
# undone at request time: prerendered HTML (/regulations is fully static and names PayPal, and the
# home page bakes the live "E-Visa - Standard Processing" listing title), the inlined
# NEXT_PUBLIC_APP_URL that every canonical and OG url derives from, and the client chunks (the string
# "Pay with PayPal" sits in two of them). A runtime flag would ship all three to eno.vn browsers and
# merely decline to render them. "The code is not in the artifact" is a statement you can verify with
# grep; "the code declines to run" is a promise about control flow.
#
# Cost, stated plainly: this roughly doubles Cloud Build, already ~62% of this project's GCP spend,
# because every push to main now builds both editions. The two triggers run in parallel, so
# time-to-prod is unchanged. The cheap lever was already taken — see the machineType note at the
# bottom of cloudbuild.yaml, which applies here verbatim.
steps:
  # Overlap the deploy-image pull with the docker build; see the note in cloudbuild.yaml.
  - id: warm-deploy-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args: ['-c', 'docker pull gcr.io/google.com/cloudsdktool/cloud-sdk:slim || true']

  # ⚠️ A GUARD, NOT A FORMALITY. This config and cloudbuild.yaml are near-identical, so the realistic
  # mistake is a copy-paste that leaves one field pointing at the other edition — an image tagged
  # eno-vn deployed to eno-forum, or the marketplace secret feeding a services build. Either would
  # put the licensed company's identity on the services domain, or the services surfaces on the
  # licensed one, and both would deploy green. Failing here costs one build; not failing costs a
  # licence. It checks what this file ASSERTS about itself, before anything is built.
  - id: assert-edition
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test "${_EDITION}" = "services" || { echo "cloudbuild.services.yaml must build the services edition, got '${_EDITION}'"; exit 1; }
        test "${_IMAGE}" = "eno-services" || { echo "services edition must publish the eno-services image, got '${_IMAGE}'"; exit 1; }
        # A PREFIX match, not equality: it must permit eno-forum-preview / -canary, because verifying
        # a services image on a no-traffic revision before a cutover is the safe habit and a guard
        # that forbids it would just get bypassed. The case it exists to stop is unchanged — the
        # services edition must never land on eno-vn, the licensed marketplace service.
        case "${_SERVICE}" in
          eno-forum|eno-forum-*) : ;;
          *) echo "services edition may only deploy to eno-forum or an eno-forum-* preview, got '${_SERVICE}'"; exit 1 ;;
        esac
        echo "edition guard ok: ${_EDITION} → ${_SERVICE} (${_IMAGE})"

  - id: build-push
    name: gcr.io/cloud-builders/docker
    waitFor: ['assert-edition']
    entrypoint: bash
    secretEnv: ['BUILDENV']
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$BUILDENV" > /workspace/buildenv.env
        # ⚠️ APPENDED, NOT ASSUMED. The edition is what makes this build different from the
        # marketplace one, and it is too important to depend on someone having remembered to put it
        # in the secret. Appending after the secret means this file wins even if the secret carries a
        # stale or absent value — the Dockerfile sources the whole file with `set -a`, last
        # assignment winning. next.config.ts still cross-checks it against NEXT_PUBLIC_APP_URL, which
        # DOES come from the secret, so a secret pointing at the wrong host fails the build rather
        # than shipping mislabelled.
        printf '\nNEXT_PUBLIC_ENO_EDITION=%s\n' "${_EDITION}" >> /workspace/buildenv.env
        export DOCKER_BUILDKIT=1
        docker build \
          --secret id=buildenv,src=/workspace/buildenv.env \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/${_IMAGE}:${_TAG} \
          -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/${_IMAGE}:latest \
          .
        rm -f /workspace/buildenv.env
        docker push --all-tags asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/${_IMAGE}

  # ⚠️ THE eno-vn SERVICE PROFILE, NOT THE OLD FORUM ONE. docs/gcp-migration.md provisioned
  # eno-forum for a JS-only forum with no ISR; it is about to run the same app as eno.vn — ffmpeg
  # transcode, sharp, and the shared Postgres ISR cache handler. Under-provisioning it would look
  # like a mysterious visa-flow timeout rather than a config mistake.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-push', 'warm-deploy-image']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/eno/${_IMAGE}:${_TAG}
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      # ⚠️ SIZED DOWN 2026-08-02 AFTER MEASURING THE BILL, AND THE OLD SHAPE WAS BACKWARDS.
      #
      # This profile was 2 vCPU / 2 GiB with --min-instances=1. Combined with --no-cpu-throttling
      # (which bills CPU for the INSTANCE LIFETIME, not just request time) that pinned one
      # always-on instance at double resources — on the LOWER-traffic of the two sites. Measured
      # on the first full day after eno-vn also got --no-cpu-throttling: ₫75,815 of Cloud Run in
      # 24h, forecast ₫1.94M/month, against ₫72,511 for the whole PREVIOUS month.
      #
      # Meanwhile eno.vn — the licensed marketplace and the actual product — ran on 1 vCPU / 1 GiB
      # and exceeded its memory limit twice in 30 days (1026 and 1043 MiB used). The big instance
      # was pinned to the site that needed it least.
      #
      # --cpu=1 halves the dominant term (CPU costs roughly ten times memory per unit here) and
      # matches what eno.vn already runs the same image on. MEMORY STAYS AT 2Gi: 1 GiB is measurably
      # not enough for this app, and memory is the cheap axis — shrinking it would trade a small
      # saving for real OOM restarts.
      - --memory=2Gi
      - --cpu=1
      - --no-cpu-throttling
      - --timeout=320s
      # ⚠️ EXPLICITLY 0 — DELETING THE FLAG DOES NOT CLEAR IT, WHICH IS HOW THIS WAS MISSED ONCE.
      #
      # It was --min-instances=1, which with --no-cpu-throttling is a 24/7 charge whether or not
      # anybody visits. The first attempt at this simply removed the line, and the next deploy
      # changed nothing: `gcloud run deploy` only applies flags you PASS and preserves the
      # service's existing value for everything you omit. Verified after that deploy — cpu and
      # memory had both moved, and minScale was still 1.
      #
      # So an unwanted setting has to be overwritten, never omitted. Same lesson the
      # --no-cpu-throttling comment in cloudbuild.yaml records from the other direction: what is
      # not declared here is whatever somebody last left on the service.
      #
      # The cost of 0 is a cold start (a few seconds) for the first visitor after an idle period —
      # restore it when traffic makes that a real complaint, not before. `after()` work is
      # unaffected: that depends on --no-cpu-throttling, which stays.
      - --min-instances=0
      # ⚠️ THE RUNTIME SECRET, DECLARED HERE BECAUSE BUILD-TIME AND RUNTIME ENV ARE DIFFERENT THINGS
      # AND CONFLATING THEM BROKE THE CUTOVER. availableSecrets above feeds the BUILD (NEXT_PUBLIC_*
      # inlining, SSG data collection) through a BuildKit mount that never reaches the image. What
      # the running container reads is this file, mounted from Secret Manager by Cloud Run — and the
      # eno-forum service was still mounting eno-forum-env, the retiring app's secret. The first
      # cutover deploy therefore came up with no DATABASE_URL, Prisma fell back to 127.0.0.1:5432,
      # and every database-backed page 500'd while the static ones served 200 and looked fine.
      # Declaring it makes the deploy self-contained instead of depending on service state somebody
      # set by hand once.
      - --update-secrets=/secrets/env=eno-services-env:latest
      - --quiet

availableSecrets:
  secretManager:
    # ⚠️ ITS OWN SECRET, and the separation is the point rather than tidiness: this one holds
    # NEXT_PUBLIC_APP_URL=https://www.eno.forum plus the PAYPAL_*, STRIPE_*, VISA_* and BROWSERBASE_*
    # keys. Those keys are being REMOVED from eno-root-env, so the marketplace image cannot transact
    # even if a code path survived — the licensed company holds no payment credentials for a service
    # it is not licensed to sell. src/lib/visa/payments.ts already treats missing fee/keys as dormant,
    # so their removal is behaviourally a no-op on eno.vn.
    - versionName: projects/$PROJECT_ID/secrets/eno-services-env/versions/latest
      env: BUILDENV

substitutions:
  _TAG: manual
  _EDITION: services
  _SERVICE: eno-forum
  _IMAGE: eno-services

options:
  # See cloudbuild.yaml for why no machineType is pinned — the measurement applies to this build too.
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1800s
