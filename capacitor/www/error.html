<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>eno</title>
    <style>
      /* --brand values mirror the canon tokens in docs/design-language.md / globals.css
         (#0a66c2 light, #3b8ee6 dark) — this page is self-contained and can't import them. */
      :root { --bg:#ffffff; --fg:#111827; --sub:#6b7280; --brand:#0a66c2; --ring:#e5e7eb; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#1b1b1b; --fg:#f3f4f6; --sub:#9ca3af; --brand:#3b8ee6; --ring:#333; } }
      html, body { margin:0; height:100%; }
      body {
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
        padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        text-align:center; font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        background:var(--bg); color:var(--fg); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      }
      /* Zalo-style launch mark: small brand square, gentle breathing pulse. */
      .mark { width:52px; height:52px; border-radius:14px; background:var(--brand); color:#fff;
        display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px;
        animation:pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(.86); opacity:.7 } }
      h1 { font-size:19px; margin:0; font-weight:700; }
      .en { display:block; margin-top:4px; font-size:13px; font-weight:500; color:var(--sub); }
      p { margin:0; color:var(--sub); max-width:300px; line-height:1.5; font-size:15px; }
      /* Shopee-style bouncing dots under the mark. */
      .dots { display:flex; gap:6px; }
      .dots i { width:8px; height:8px; border-radius:50%; background:var(--brand); animation:bounce 1s ease-in-out infinite; }
      .dots i:nth-child(2){ animation-delay:.15s } .dots i:nth-child(3){ animation-delay:.3s }
      @keyframes bounce { 0%,100%{ transform:translateY(0); opacity:.5 } 40%{ transform:translateY(-7px); opacity:1 } }
      button { margin-top:6px; border:0; border-radius:14px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; padding:14px 30px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
      button:active { opacity:.85; }
    </style>
  </head>
  <!--
    Capacitor server.errorPath target. Shown when the remote load (https://eno.vn) fails — a branded
    "offline" state instead of a blank WebView. Auto-retries in the background and when connectivity
    returns; a manual button is always available. All self-contained (no network needed to render).
  -->
  <body>
    <div class="mark">e</div>
    <h1>Không có kết nối mạng<span class="en" lang="en">You're offline</span></h1>
    <p>Chưa kết nối được với eno. Chúng tôi sẽ tự thử lại — bạn kiểm tra lại mạng giúp nhé.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <button id="retry" type="button">Thử lại</button>
    <script>
      var URL_ = 'https://eno.vn';
      function retry() { location.href = URL_; }
      document.getElementById('retry').addEventListener('click', retry);
      // Recover the instant connectivity returns, and auto-retry periodically as a backstop
      // (a failed retry just reloads this page, so the loop self-heals when the network is back).
      window.addEventListener('online', retry);
      setTimeout(retry, 6000);
    </script>
  </body>
</html>
