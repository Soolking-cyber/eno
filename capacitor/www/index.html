<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- No `maximum-scale=1`, deliberately. The app's text-scaling policy (src/lib/native-text-zoom.ts
         + src/components/marketplace/keyboard-viewport-sync.tsx) locks the scale ONLY on iOS, ONLY to
         stop the focus auto-zoom on <input>s, and pays for it with @capacitor/text-zoom honouring the
         OS Dynamic Type setting. This page has no inputs (so nothing to auto-zoom) and no bundle (so
         no text-zoom to compensate) — locking the scale here would leave it in the one quadrant that
         policy exists to prevent: no pinch AND no OS text size. Pinch stays available instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>eno</title>
    <!--
      PHASE 2 · M1 — the INSTANT LOCAL SHELL (native-shell migration, docs/native-shell-phase2.md).
      When the app is built with ENO_LOCAL_SHELL=1 (capacitor.config.ts), the WebView boots THIS
      page from disk (~100ms) instead of waiting on the network for eno.vn: the splash hides
      immediately, a canon-styled skeleton paints, and we forward to the live app (carrying any
      cold-start deep link). Offline shows an inline retry instead of a dead splash. Self-contained
      by design — no imports; brand values mirror docs/design-language.md tokens.
      In remote mode (no flag) this page remains the webDir placeholder it always was.
    -->
    <style>
/* ⛔ THE SHELL PAINTS IN THE SITE'S OWN FACE, NOT THE SYSTEM ONE. This screen exists to be the
   first thing an app launch shows, and until now it drew in -apple-system while the site it hands
   over to draws in Open Runde — so the launch visibly re-set itself a beat later, which is exactly
   the mismatch the owner reported (2026-09-06: "ios loading screen is not matched to mobile
   version loading show eno.vn open runde version").
   ⚠️ THE FILES ARE BUNDLED, NOT FETCHED. The shell's whole purpose is to paint before the network
   answers, so a webfont it had to download would arrive after the thing it is meant to style.
   `font-display:block` is deliberate for the same reason: a brief invisible beat is better than
   painting the wordmark in the system face and swapping it. */
@font-face{font-family:"Open Runde";src:url(./open-runde-regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Open Runde";src:url(./open-runde-bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}

      /* Theme: first paint follows the OS scheme; the script below corrects to the APP's
         last resolved choice (mirrored into native Preferences by theme-context) within
         milliseconds — a Light-app-on-Dark-phone paints light, and vice versa. Explicit
         .t-light/.t-dark classes outrank the media query. */
      :root { --bg:#fafafa; --card:#fafafa; --tint:#eef2f6; --fg:#111827; --sub:#6b7280; --brand:#0a66c2; --ring:#e5e7eb; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#1b1b1b; --card:#1b1b1b; --tint:#2e2e2e; --fg:#f3f4f6; --sub:#9ca3af; --brand:#3b8ee6; --ring:#333; } }
      html.t-light { --bg:#fafafa; --card:#fafafa; --tint:#eef2f6; --fg:#111827; --sub:#6b7280; --brand:#0a66c2; --ring:#e5e7eb; }
      html.t-dark { --bg:#1b1b1b; --card:#1b1b1b; --tint:#2e2e2e; --fg:#f3f4f6; --sub:#9ca3af; --brand:#3b8ee6; --ring:#333; }
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; background:var(--bg); }
      body {
        font-family:"Open Runde",-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color:var(--fg);
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
        padding-top:env(safe-area-inset-top);
      }
      header { display:flex; align-items:center; gap:12px; padding:14px 12px 10px; }
      .wordmark { font-weight:800; font-size:26px; letter-spacing:-1px; color:var(--brand); }
      .search { flex:1; height:40px; border-radius:14px; background:var(--tint); }
      .bell { width:34px; height:34px; border-radius:50%; background:var(--tint); }
      .chips { display:flex; gap:8px; padding:2px 12px 12px; }
      .chip { height:30px; border-radius:9999px; background:var(--tint); }
      .chip:nth-child(1){ width:84px } .chip:nth-child(2){ width:64px } .chip:nth-child(3){ width:96px } .chip:nth-child(4){ width:72px }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px; }
      .card { border-radius:12px; overflow:hidden; background:var(--card); border:1px solid var(--ring); }
      .ph { aspect-ratio:1; background:var(--tint); }
      .meta { padding:10px; }
      .bar { height:12px; border-radius:6px; background:var(--tint); margin-bottom:8px; }
      .bar.b1 { width:55%; height:16px } .bar.b2 { width:90% } .bar.b3 { width:40%; margin-bottom:0 }
      .shimmer { position:relative; overflow:hidden; }
      .shimmer::after { content:""; position:absolute; inset:0; transform:translateX(-100%);
        background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
        animation:sh 1.3s infinite; }
      @media (prefers-color-scheme: dark){ .shimmer::after{ background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);} }
      @keyframes sh { to { transform:translateX(100%); } }
      /* Offline / failed state (hidden until needed) */
      #offline { display:none; position:fixed; inset:0; background:var(--bg); z-index:10;
        flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
        padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
      /* No logo/mascot loader frames (owner verdict 2026-07-20): the offline
         state is plain text + retry, matching the app's own error surfaces. */
      #offline h1 { font-size:19px; margin:0; font-weight:700; }
      #offline .en { display:block; margin-top:4px; font-size:13px; font-weight:500; color:var(--sub); }
      #offline p { margin:0; color:var(--sub); max-width:300px; line-height:1.5; font-size:15px; }
      #offline button { margin-top:6px; border:0; border-radius:14px; background:var(--brand); color:#fff;
        font-size:16px; font-weight:600; padding:14px 30px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
      #offline button:active { opacity:.85; }
    </style>
  </head>
  <body>
    <header>
      <div class="wordmark">eno</div>
      <div class="search shimmer"></div>
      <div class="bell shimmer"></div>
    </header>
    <div class="chips">
      <div class="chip shimmer"></div><div class="chip shimmer"></div><div class="chip shimmer"></div><div class="chip shimmer"></div>
    </div>
    <div class="grid" id="grid"></div>

    <div id="offline">
      <h1>Không có kết nối mạng<span class="en">No internet connection</span></h1>
      <p>Kiểm tra kết nối của bạn rồi thử lại. / Check your connection and try again.</p>
      <button onclick="go()">Thử lại / Try again</button>
    </div>

    <script>
      // Skeleton cards (6 = one viewport of the 2-col feed).
      var g = document.getElementById('grid')
      for (var i = 0; i < 6; i++) {
        g.insertAdjacentHTML('beforeend',
          '<div class="card"><div class="ph shimmer"></div><div class="meta">' +
          '<div class="bar b1 shimmer"></div><div class="bar b2 shimmer"></div><div class="bar b3 shimmer"></div></div></div>')
      }

      var ORIGIN = 'https://eno.vn'
      var HOSTS = { 'eno.vn': 1, 'www.eno.vn': 1, 'eno.forum': 1, 'www.eno.forum': 1 }

      // Cold-start deep link → same-origin path (mirrors src/lib/deep-link.ts's contract:
      // first-party hosts only, auth paths blocked, anything unknown lands on home).
      function targetFromLaunch(urlStr) {
        try {
          var u = new URL(urlStr)
          if (!HOSTS[u.hostname]) return ORIGIN + '/'
          var path = u.pathname + u.search
          if (u.pathname.indexOf('/auth') === 0) return ORIGIN + '/'
          return (u.hostname.indexOf('forum') !== -1 ? 'https://' + u.hostname : ORIGIN) + path
        } catch (e) { return ORIGIN + '/' }
      }

      // ⚠️ `Capacitor.Plugins.<Name>` does NOT exist here. That object is built by @capacitor/core's
      // registerPlugin() when a JS BUNDLE imports the plugin; the native bridge injected into every
      // WebView (native-bridge.js) only ever *reads* `cap.Plugins` — it never creates it. This page
      // has no bundle, so the low-level `Capacitor.nativePromise(plugin, method, options)` the bridge
      // always defines is the real channel. It resolves with the plugin's own result object
      // (`{ value }` for Preferences.get, `{ url }` for App.getLaunchUrl) — the same shape the SDK
      // returns. The Plugins branch stays as a no-cost fast path in case this file is ever loaded
      // inside the app bundle. Ported verbatim from error.html, which already had this right.
      // Note nativePromise NEVER settles when the bridge is missing (toNative just warns), which is
      // exactly why every caller below either owns a timeout or is safe to leave hanging.
      function nativeCall(plugin, method, options) {
        var C = window.Capacitor
        if (!C) return null
        try {
          var P = C.Plugins && C.Plugins[plugin]
          if (P && typeof P[method] === 'function') return P[method](options)
          if (typeof C.nativePromise === 'function') return C.nativePromise(plugin, method, options)
        } catch (e) { /* fall through */ }
        return null
      }

      // PAGE-scoped, not per-call: this shell's whole job is exactly ONE navigation. Two
      // things can otherwise fire it twice. (a) Within one go(): the 350ms timeout lands,
      // then the bridge resolves late — and with nativePromise that window is wider than it
      // was with the (never-populated) Plugins object. (b) ACROSS calls: the `online`
      // listener re-enters go() while a previous attempt is still pending, and a per-call
      // flag cannot see the other attempt, so both replace() — possibly to different
      // targets. Once we have committed to a destination, a second replace() is a visible
      // flash and a junk history entry, so the first one wins. (codex caught the cross-call
      // case; the offline early-return below never sets this, so retry-when-online still works.)
      var navigated = false

      function go() {
        document.getElementById('offline').style.display = 'none'
        if (navigator.onLine === false) {
          document.getElementById('offline').style.display = 'flex'
          return
        }
        if (navigated) return
        var target = ORIGIN + '/'
        var done = function () {
          if (navigated) return
          navigated = true
          // Release the latch if replace() throws synchronously (a blocked or otherwise
          // rejected navigation). Without this the flag would stay set after a navigation
          // that never happened, and every later go() — including the `online` retry —
          // would return early, stranding the launch on the skeleton for good. (codex)
          try {
            window.location.replace(target)
          } catch (e) {
            navigated = false
          }
        }
        var p = nativeCall('App', 'getLaunchUrl')
        if (!p || typeof p.then !== 'function') { done(); return }
        // Bounded: a hung bridge must never strand the shell on the skeleton.
        var t = setTimeout(done, 350)
        p.then(function (r) {
          clearTimeout(t)
          if (r && r.url) target = targetFromLaunch(r.url)
          done()
        }).catch(function () { clearTimeout(t); done() })
      }

      // Apply the APP's last resolved theme (native Preferences mirror) over the OS guess.
      // No timeout: if the bridge never answers, the OS guess simply stands — which is the
      // behaviour this page had for its whole life, since the old Plugins deref never resolved.
      try {
        var pTheme = nativeCall('Preferences', 'get', { key: 'eno-resolved-theme' })
        if (pTheme && typeof pTheme.then === 'function') pTheme.then(function (r) {
          if (r && (r.value === 'light' || r.value === 'dark')) document.documentElement.className = 't-' + r.value
        }).catch(function () {})
      } catch (e) {}

      // Reveal instantly: the shell IS the paint — no reason to hold the splash.
      try {
        var pSplash = nativeCall('SplashScreen', 'hide', { fadeOutDuration: 150 })
        // Swallow a rejection so a missing/!enabled SplashScreen plugin can't surface as an
        // unhandled rejection in the WebView console on every launch.
        if (pSplash && typeof pSplash.catch === 'function') pSplash.catch(function () {})
      } catch (e) {}

      // A failed eno.vn navigation falls to Capacitor's errorPath (error.html) natively;
      // the online check above catches the airplane-mode case without a doomed attempt.
      go()
      window.addEventListener('online', go)
    </script>
  </body>
</html>
